  height: 175,
  activity: 1.3,       // 日常活动系数（不含训练）
  deficit: 500,        // 目标缺口
  manualKcal: 1900     // 手动模式下的每日预算
};

const ACTIVITY_LEVELS = [
  { v: 1.2, t: '久坐', d: '办公室 / 学生，几乎不走动' },
  { v: 1.3, t: '轻度', d: '通勤走动，每天 3000~6000 步' },
  { v: 1.45, t: '中度', d: '每天 8000~12000 步，或常站着工作' },
  { v: 1.6, t: '高度', d: '体力工作，或每天 15000 步以上' },
  { v: 1.75, t: '极高', d: '重体力工作 / 建筑 / 农活' }
];

function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    if (!raw) return { ...DEFAULT_PROFILE };
    const p = JSON.parse(raw);
    return { ...DEFAULT_PROFILE, ...(p && typeof p === 'object' ? p : {}) };
  } catch (e) {
    return { ...DEFAULT_PROFILE };
  }
}

function saveProfile() {
  try {
    /* 体重挂在 state 上（它就是当日行情报价），但它是用户亲手填的数据，
       必须一起落盘 —— 否则刷新一下就回到默认 64.20，等于白改。 */
    localStorage.setItem(PROFILE_KEY, JSON.stringify({ ...profile, weight: state.weight }));
    touchData('设置');
  } catch (e) {
    toast('本地存储不可用，设置仅在本次会话生效');
  }
}

let profile = loadProfile();

/* 上次填的体重优先于内置默认值；越界的一律忽略，防止脏数据把行情搞崩 */
if (Number(profile.weight) >= 30 && Number(profile.weight) <= 250) {
  state.weight = Number(profile.weight);
}

/* Mifflin-St Jeor：目前对普通人群误差最小的公式（±10% 内） */
function bmrMifflin(w, h, a, sex) {
  return 10 * w + 6.25 * h - 5 * a + (sex === 'male' ? 5 : -161);
}
/* Harris-Benedict 修订版：老公式，普遍略偏高，用来给上界参考 */
function bmrHarris(w, h, a, sex) {
  return sex === 'male'
    ? 88.362 + 13.397 * w + 4.799 * h - 5.677 * a
    : 447.593 + 9.247 * w + 3.098 * h - 4.330 * a;
}

const actFactor = () => Math.max(1, Number(profile.activity) || 1.2);
const bmrBase = () => {
  const h = Number(profile.height) || 170;
  const a = Number(profile.age) || 30;
  return bmrMifflin(state.weight, h, a, profile.sex);
};
const bmr = () => Math.round(bmrBase());
const tdee = () => Math.round(bmrBase() * actFactor());
const neat = () => tdee() - bmr();                       // 生活活动那部分消耗

/* 安全下限：不低于基础代谢的 85%，也不低于性别通用下限。
   BMR 是躺着不动也要烧掉的量，长期吃不到这个数，掉的主要是肌肉和代谢。 */
const budgetFloor = () => Math.max(Math.round(bmrBase() * 0.85), profile.sex === 'male' ? 1500 : 1200);

/* 摄入 / 消耗 / 净额都按「所选交易日」算：
   归档日（过去某天且本地没有逐笔记录）直接取历史序列里的汇总数，
   这样行情、大盘、复盘、营养看到的是同一天的同一组数字。 */
const intake = () => {
  const a = archivedDay();
  if (a) return a.intake;
  return state.logs.filter(l => l.type === 'food').reduce((s, l) => s + l.kcal, 0);
};
const exerciseBurn = () => {
  const a = archivedDay();
  if (a) return Math.max(0, a.burn - tdee());   // 归档日的消耗里扣掉基础代谢与日常活动
  return state.logs.filter(l => l.type === 'burn').reduce((s, l) => s + l.kcal, 0);
};
const burn = () => tdee() + exerciseBurn();
const net = () => intake() - burn();
const kgDelta = () => net() / KCAL_PER_KG;
const liveWeight = () => {
  const a = archivedDay();
  return a ? a.close : state.weight + kgDelta();
};
const caloriesOf = (s) => Math.round(((Number(s.per100) || 0) * (Number(s.grams) || 0)) / 100);
const efficiency = (s) => {
  const price = Number(s.price) || 0;
  if (price <= 0) return 0;
  const base = CAT_BASE[s.cat] || 800;
  return Math.round(((base - caloriesOf(s)) / price) * 10) / 10;
};
const fmt = (n, d = 2) => Number(n).toFixed(d);
const fmtVol = (v) => (v >= 10000 ? Math.round(v / 1000) + 'k' : String(Math.round(v)));
const signCls = (n) => (n > 0 ? 'up' : n < 0 ? 'down' : 'flat');
const signTxt = (n, d = 2) => (n > 0 ? '+' : '') + fmt(n, d);
/* 屏幕上的「盈亏」= 消耗 − 摄入 = −net()。减脂是做空：缺口越大越是赚，
   所以正数=赚、负数=亏，跟行情软件一致。内部 net()/gap 仍保持原方向，只在显示时取反。 */
const profitOf = (netVal) => -netVal;
const profitTxt = (netVal, d = 0) => (profitOf(netVal) > 0 ? '+' : '') + fmt(profitOf(netVal), d);
const profitCls = (netVal) => (netVal < 0 ? 'down' : netVal > 0 ? 'up' : 'flat');

/* 今日热量预算：本次改造的核心。
   auto   → 总消耗 − 目标缺口，训练了就能多吃（这才是可持续的模型）
   manual → 用户直接指定，不随运动变化（适合严格控卡阶段） */
function budgetInfo() {
  const ex = exerciseBurn();
  const floor = budgetFloor();
  const base = { bmr: bmr(), tdee: tdee(), neat: neat(), exercise: ex, floor };

  if (profile.mode === 'manual') {
    const raw = Math.max(0, Math.round(Number(profile.manualKcal) || 0));
    return { ...base, mode: 'manual', kcal: raw, raw, capped: false };
  }

  const deficit = Number(profile.deficit) || 0;
  const raw = Math.round(tdee() + ex - deficit);
  const kcal = Math.max(floor, raw);
  return { ...base, mode: 'auto', kcal, raw, deficit, capped: raw < floor };
}

const intakeBudget = () => budgetInfo().kcal;

/* 有效目标缺口：自动模式下恒等于 profile.deficit；
   手动模式下由「预算 vs 消耗」反推，可能是负数 —— 那就是吃超了，即盈余。 */
const targetDeficit = () => Math.round(burn() - intakeBudget());

/* 热量盈余：摄入 − 预算。正数是超预算（做多），负数是还有余量（做空）。
   注意它和 net() 不是一回事：net 是「摄入 − 总消耗」的真实缺口，
   盈余是「相对计划」的偏离。两个都要看，否则会误以为自己很努力。 */
const surplus = () => intake() - intakeBudget();
const surplusRate = () => {
  const t = intakeBudget();
  return t > 0 ? (surplus() / t) * 100 : 0;
};

/* ================= 行情数据引擎 =================
   日 / 周 / 月 / 季 / 年 五张 K 线全部来自同一份日度序列聚合，
   不是五张各画各的图 —— 否则周期之间会自相矛盾。

   ⚠️ 历史行情为演示数据：由确定性算法按「体重控制点 + 每日净缺口 + 水分基差」
   生成，保证 Open[i] = Close[i-1] 且昨日收盘等于当前报价。
   真实产品里这一段应替换为逐日累积的真实记录，接口不用改。 */

const DAY_MS = 86400000;
const OPEN_PRICE = 66.80;          // 开仓价（成本价）
const OPEN_DAY = '2025-07-01';     // 开仓日：此前的走势属于"开户前的体重史"

const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayMid = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* 体重控制点：决定长期走势的骨架。
   前段是增重期（相当于一直在做多），2023 年起转向做空，2025-07 开仓。 */
const WEIGHT_CP = [
  ['2021-10-26', 79.40],
  ['2022-03-01', 80.10],
  ['2022-10-01', 81.70],
  ['2023-03-01', 82.90],   // 增重高点
  ['2023-09-01', 74.90],
  ['2024-04-01', 71.30],
  ['2024-11-01', 69.60],
  ['2025-03-01', 68.90],
  ['2025-07-01', 66.80],   // 开仓做空
  ['2025-12-01', 65.80],
  ['2026-04-01', 66.30],   // 反弹
  ['2026-08-01', 64.90]
];

function buildDays(nDays) {
  const rnd = mulberry32(20261025);
  const gauss = () => {
    let u = 0, v = 0;
    while (!u) u = rnd();
    while (!v) v = rnd();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  const end = todayMid();
  end.setDate(end.getDate() - 1);                       // 序列止于昨天
  const start = new Date(end.getTime() - (nDays - 1) * DAY_MS);

  /* 控制点：首点对齐序列起点，末点对齐昨收，保证首尾严格落位 */
  const cps = [{ t: start, w: WEIGHT_CP[0][1] }];
  WEIGHT_CP.slice(1).forEach(([s, w]) => {
    const t = new Date(s + 'T00:00:00');
    if (t > start && t < end) cps.push({ t, w });
  });
  cps.push({ t: end, w: state.weight });

  /* 逐日基准缺口：区间左闭右开，最后一段包含末日，天数因此正好等于 nDays */
  const idxOf = (t) => clamp(Math.round((t - start) / DAY_MS), 0, nDays - 1);
  const segs = [];
  for (let i = 0; i < cps.length - 1; i++) {
    const da = idxOf(cps[i].t);
    const db = i === cps.length - 2 ? nDays : Math.max(da + 1, idxOf(cps[i + 1].t));
    if (db <= da) continue;
    segs.push({ da, db, base: ((cps[i + 1].w - cps[i].w) * KCAL_PER_KG) / (db - da) });
  }

  const base = new Array(nDays).fill(0);
  segs.forEach((s) => { for (let k = s.da; k < s.db; k++) base[k] = s.base; });

  /* 噪声在每段内强制零均值：既保留日间波动，又让区间端点严格落在控制点上 */
  const noise = Array.from({ length: nDays }, () => gauss() * 340);
  segs.forEach(({ da, db }) => {
    let m = 0;
    for (let k = da; k < db; k++) m += noise[k];
    m /= db - da;
    for (let k = da; k < db; k++) noise[k] -= m;
  });

  const days = [];
  let trend = cps[0].w;      // 趋势体重：每日净缺口的积分
  let water = 0;             // 水分基差：围绕趋势波动
  let prevClose = cps[0].w;

  for (let i = 0; i < nDays; i++) {
    let netKcal = Math.round((base[i] + noise[i]) / 10) * 10;

    /* 日常消耗：基础代谢 + 当天活动量 */
    let burnKcal = Math.round(bmrBase() + neat() + clamp(260 + gauss() * 150, 60, 820));
    let intakeKcal = Math.round(burnKcal + netKcal);

    /* 摄入必须落在人类可实现的区间。若越界，用当日活动量吸收差异，
       而不是截断净缺口 —— 否则缺口不达标的日子会日积月累变成几公斤的偏差。 */
    if (intakeKcal < 1400 || intakeKcal > 3300) {
      const fixed = Math.min(3300, Math.max(1400, intakeKcal));
      const altBurn = fixed - netKcal;
      if (altBurn >= 1400 && altBurn <= 3400) {
        burnKcal = altBurn;
        intakeKcal = fixed;
      } else {
        burnKcal = Math.round(clamp(altBurn, 1400, 3400));
        intakeKcal = burnKcal + netKcal;
        netKcal = intakeKcal - burnKcal;
      }
    }

    /* 水分：均值回归的随机过程，这是体重噪音的来源，也是"基差"的成因 */
    water = clamp(water * 0.86 + gauss() * 0.17, -0.95, 0.95);

    trend += netKcal / KCAL_PER_KG;
    const close = trend + water;
    const open = prevClose;                           // 昨收即今开，隔夜水分变化体现为跳空
    const body = Math.abs(close - open);
    const high = Math.max(open, close) + Math.abs(gauss()) * 0.1 + body * 0.35;
    const low = Math.min(open, close) - Math.abs(gauss()) * 0.1 - body * 0.35;

    const pr = clamp(0.16 + gauss() * 0.045, 0.07, 0.32);   // 蛋白质供能比
    const fr = clamp(0.33 + gauss() * 0.065, 0.16, 0.52);   // 脂肪供能比
    const pro = Math.round((intakeKcal * pr) / 4);
    const fat = Math.round((intakeKcal * fr) / 9);
    const carb = Math.max(0, Math.round((intakeKcal - pro * 4 - fat * 9) / 4));
    const fib = Math.round(clamp(12 + gauss() * 5.5, 1, 34));

    days.push({
      date: ymd(new Date(start.getTime() + i * DAY_MS)),
      open: +open.toFixed(2), high: +high.toFixed(2), low: +low.toFixed(2), close: +close.toFixed(2),
      net: netKcal, intake: intakeKcal, burn: burnKcal, vol: burnKcal,
      pro, fat, carb, fib, live: false
    });
    prevClose = close;
  }

  /* 闭环校正：让累计净缺口精确等于控制点的总变化，消掉逐日取整的残差 */
  const targetKcal = (state.weight - cps[0].w) * KCAL_PER_KG;
  const actualKcal = days.reduce((s, d) => s + d.net, 0);
  const fixDay = Math.round((targetKcal - actualKcal) / nDays);
  if (fixDay !== 0) {
    days.forEach((d) => { d.net += fixDay; d.intake += fixDay; });
  }

  /* 整体平移只用来吸收末日的水分基差，幅度很小；平移不改变任何涨跌关系 */
  const diff = state.weight - days[days.length - 1].close;
  if (Math.abs(diff) > 0.0001) {
    days.forEach((d) => {
      d.open = +(d.open + diff).toFixed(2);
      d.high = +(d.high + diff).toFixed(2);
      d.low = +(d.low + diff).toFixed(2);
      d.close = +(d.close + diff).toFixed(2);
    });
  }
  return days;
}

/* 历史序列可重建：体重是最敏感的参数，改了它整条曲线都要跟着重算 */
let HISTORY = buildDays(1825);   // 5 年 ≈ 1825 个交易日
function rebuildHistory() {
  HISTORY = buildDays(1825);
}

/* ================= 交易日上下文 =================
   整个 App 挂在「所选交易日」上：行情报价、K 线终点、大盘、买入/卖出写入哪一天、
   复盘区间、营养汇总，全部跟着 state.selDate 走。

   过去某天如果本地没有逐笔记录，就退化成「归档日」：只显示历史序列里的汇总数。
   给它补记任意一笔之后，就以你的记录为准 —— 归档的演示数不再叠加，否则会重复计算。 */
const todayStr = () => ymd(todayMid());
const histRecord = (date) => HISTORY.find((d) => d.date === date) || null;
const selIsToday = () => state.selDate === todayStr();
const selDateObj = () => new Date(state.selDate + 'T00:00:00');

function archivedDay() {
  if (!state.selDate || selIsToday() || state.logs.length) return null;
  return histRecord(state.selDate);
}

/* 所选交易日这一根 K 线 */
function selBar() {
  const a = archivedDay();
  if (a) return a;
  const prev = HISTORY.filter((d) => d.date < state.selDate).pop();
  const o = prev ? prev.close : state.weight;
  const c = o + kgDelta();
  const g = dayNutrients();
  return {
    date: state.selDate,
    open: +o.toFixed(2),
    high: +Math.max(o, c).toFixed(2),
    low: +Math.min(o, c).toFixed(2),
    close: +c.toFixed(2),
    net: net(), intake: intake(), burn: burn(), vol: burn(),
    pro: +g.p.toFixed(1), fat: +g.f.toFixed(1), carb: +g.c.toFixed(1), fib: +g.fb.toFixed(1),
    live: selIsToday()
  };
}

/* 序列在所选交易日截止：看历史日期时，K 线右端就是那一天 */
function ALL_DAYS() {
  if (selIsToday()) return HISTORY.concat([selBar()]);
  const past = HISTORY.filter((d) => d.date < state.selDate);
  if (state.logs.length) return past.concat([selBar()]);
  const rec = histRecord(state.selDate);
  return rec ? past.concat([rec]) : past;
}

/* ---------- 周期聚合：五张图同源 ---------- */
function bucketKey(dateStr, period) {
  const [y, m, d] = dateStr.split('-').map(Number);
  if (period === 'D') return dateStr;
  if (period === 'W') {
    const t = new Date(y, m - 1, d);
    t.setDate(t.getDate() - ((t.getDay() + 6) % 7));   // 以周一为一周起点
    return 'W' + ymd(t);
  }
  if (period === 'M') return `${y}-${pad2(m)}`;
  if (period === 'Q') return `${y}Q${Math.floor((m - 1) / 3) + 1}`;
  return String(y);
}

function aggregate(days, period) {
  const out = [];
  let cur = null, key = null;
  for (const d of days) {
    const k = bucketKey(d.date, period);
    if (k !== key) {
      if (cur) out.push(cur);
      key = k;
      cur = {
        key: k, label: k, open: d.open, high: d.high, low: d.low, close: d.close,
        net: 0, intake: 0, burn: 0, vol: 0, pro: 0, fat: 0, carb: 0, fib: 0,
        from: d.date, to: d.date, n: 0, live: false
      };
    }
    cur.high = Math.max(cur.high, d.high);
    cur.low = Math.min(cur.low, d.low);
    cur.close = d.close;
    cur.net += d.net; cur.intake += d.intake; cur.burn += d.burn; cur.vol += d.vol;
    cur.pro += d.pro; cur.fat += d.fat; cur.carb += d.carb; cur.fib += d.fib;
    cur.to = d.date; cur.n += 1; cur.live = cur.live || !!d.live;
  }
  if (cur) out.push(cur);
  return out;
}

/* bars 是「中」档的根数。原来日线 60 根、周线 52 根，316px 的绘图区里一根只有
   5px 宽，蜡烛和成交量糊成一片，看不出哪天是高开低走 —— 所以默认值砍一半，
   再给疏/中/密三档让用户自己收放。 */
const PERIOD_META = {
  D: { name: '日', bars: 24, ma: 7 },
  W: { name: '周', bars: 26, ma: 4 },
  M: { name: '月', bars: 18, ma: 3 },
  Q: { name: '季', bars: 12, ma: 2 },
  Y: { name: '年', bars: 5, ma: 0 }
};

/* 疏 / 中 / 密：乘在默认根数上。日线对应 16 / 24 / 37 根，
   16 根时一根宽约 19px，蜡烛和量柱都能看清影线。 */
const K_ZOOM = [
  { k: 0.65, name: '疏' },
  { k: 1, name: '中' },
  { k: 1.55, name: '密' }
];

function periodBars(period) {
  const meta = PERIOD_META[period] || PERIOD_META.D;
  const z = K_ZOOM[state.kZoom] || K_ZOOM[1];
  const all = aggregate(ALL_DAYS(), period);
  const n = Math.max(4, Math.round(meta.bars * z.k));
  return all.slice(Math.max(0, all.length - n));
}

/* ---------------- 营养维度 ---------------- */

/* 三大营养素目标：
   蛋白质 1.8g / kg 体重（减脂期保肌），脂肪占预算 25%，碳水用剩余热量补齐，纤维 25g */
function nutritionTargets() {
  const kcal = intakeBudget();
  const p = Math.round(state.weight * 1.8);
  const f = Math.round((kcal * 0.25) / 9);
  const c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return { kcal, p, f, c, fb: 25 };
}

const round1 = (v) => Math.round(v * 10) / 10;

/* 单份标的的营养（每100g 值 × 克重） */
function nutrientsOf(s) {
  const k = (Number(s.grams) || 0) / 100;
  return {
    kcal: caloriesOf(s),
    p: round1((Number(s.p) || 0) * k),
    f: round1((Number(s.f) || 0) * k),
    c: round1((Number(s.c) || 0) * k),
    fb: round1((Number(s.fb) || 0) * k)
  };
}

/* 所选交易日的营养汇总（归档日取历史序列里的宏量营养） */
function dayNutrients() {
  const a = archivedDay();
  if (a) return { kcal: a.intake, p: a.pro, f: a.fat, c: a.carb, fb: a.fib };
  return state.logs
    .filter((l) => l.type === 'food')
    .reduce(
      (acc, l) => {
        acc.kcal += Number(l.kcal) || 0;
        acc.p += Number(l.p) || 0;
        acc.f += Number(l.f) || 0;
        acc.c += Number(l.c) || 0;
        acc.fb += Number(l.fb) || 0;
        return acc;
      },
      { kcal: 0, p: 0, f: 0, c: 0, fb: 0 }
    );
}

/* 老数据迁移：从食物库补齐缺失的营养字段，避免历史记录断档 */
function fillNutrition(shop) {
  if (Number(shop.p) > 0) return shop;
  const base = FOOD_DB.find((f) => f.n === shop.food) || FOOD_DB.find((f) => f.n === shop.dish);
  if (!base) return shop;
  return { ...shop, p: base.p, f: base.f, c: base.c, fb: base.fb, kcal: base.k };
}

/* ---------- 通用 K 线渲染：任意周期同一套画法 ---------- */
const UP = '#3DD68C', DOWN = '#E5484D';

/* "近 24 个交易日"不够直观，直接说是哪段日子 */
function periodRangeText(period, bars) {
  if (!bars.length) return '';
  const a = bars[0], b = bars[bars.length - 1];
  if (period === 'D') return `${a.from.slice(5).replace('-', '/')}–${b.from.slice(5).replace('-', '/')}`;
  if (period === 'W' || period === 'M') return `${a.from.slice(2, 7).replace('-', '/')}–${b.to.slice(2, 7).replace('-', '/')}`;
  return `${a.key}–${b.key}`;
}

function barLabel(bar, period) {
  if (period === 'D' || period === 'W') return bar.from.slice(5).replace('-', '/');
  if (period === 'M') return bar.from.slice(2, 7).replace('-', '/');
  if (period === 'Q') return bar.key.slice(2);
  return bar.key;
}

let __KGEO = null;

function renderKline(bars, period) {
  const n = bars.length;
  if (!n) return '<div class="empty">暂无行情</div>';

  const W = 372, H = 216;
  const PADL = 44, PADR = 12, PTOP = 14, PBOT = 156, VTOP = 168, VBOT = 196;
  const XW = W - PADL - PADR;
  const step = XW / n;
  const cw = Math.max(2.6, Math.min(step * 0.7, 24));

  const lo0 = Math.min(...bars.map((b) => b.low));
  const hi0 = Math.max(...bars.map((b) => b.high));
  /* 目标位离得太远就不强行拉进纵轴，否则近期走势会被压扁 */
  const span0 = hi0 - lo0 || 1;
  const lo = state.targetWeight < lo0 && lo0 - state.targetWeight <= span0 * 0.14 ? state.targetWeight : lo0;
  const hi = state.targetWeight > hi0 && state.targetWeight - hi0 <= span0 * 0.14 ? state.targetWeight : hi0;
  const span = hi - lo || 1;
  const yMin = lo - span * 0.08, yMax = hi + span * 0.08;
  const y = (v) => PBOT - ((v - yMin) / (yMax - yMin)) * (PBOT - PTOP);
  const maxVol = Math.max(...bars.map((b) => b.vol || 0), 1);

  let s = '';

  /* 横向网格 + 右侧价格刻度 */
  for (let g = 0; g < 5; g++) {
    const v = yMin + ((yMax - yMin) * g) / 4;
    const yy = y(v).toFixed(1);
    s += `<line x1="${PADL}" y1="${yy}" x2="${W - PADR}" y2="${yy}" stroke="#1C232B" stroke-width="1"/>`;
    s += `<text x="${PADL - 6}" y="${(+yy + 3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#5C6672" font-family="ui-monospace,monospace">${v.toFixed(2)}</text>`;
  }

  /* 目标位 */
  if (state.targetWeight > yMin && state.targetWeight < yMax) {
    const ty = y(state.targetWeight).toFixed(1);
    s += `<line x1="${PADL}" y1="${ty}" x2="${W - PADR}" y2="${ty}" stroke="${DOWN}" stroke-width="0.9" stroke-dasharray="4 4" opacity="0.4"/>`;
    s += `<text x="${W - PADR}" y="${+ty - 4}" text-anchor="end" font-size="8" fill="${DOWN}" opacity="0.75" font-family="ui-monospace,monospace">目标 ${state.targetWeight.toFixed(2)}</text>`;
  }

  /* 开仓标记 */
  const openIdx = bars.findIndex((b) => b.from <= OPEN_DAY && b.to >= OPEN_DAY);
  if (openIdx >= 0) {
    const ox = (PADL + step * openIdx + step / 2).toFixed(1);
    s += `<line x1="${ox}" y1="${PTOP}" x2="${ox}" y2="${VBOT}" stroke="#D29922" stroke-width="1" stroke-dasharray="2 3" opacity="0.35"/>`;
    s += `<text x="${ox}" y="${PTOP - 3}" text-anchor="middle" font-size="8" fill="#D29922" opacity="0.85" font-family="ui-monospace,monospace">开仓</text>`;
  }

  /* 蜡烛 + 成交量 */
  for (let i = 0; i < n; i++) {
    const b = bars[i];
    const cx = PADL + step * i + step / 2;
    const up = b.close >= b.open;
    const col = up ? UP : DOWN;
    const op = b.live ? 0.62 : 1;
    s += `<line x1="${cx.toFixed(1)}" y1="${y(b.high).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${y(b.low).toFixed(1)}" stroke="${col}" stroke-width="1" opacity="${op}"/>`;
    const top = y(Math.max(b.open, b.close));
    const bot = y(Math.min(b.open, b.close));
    s += `<rect x="${(cx - cw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(bot - top, 1.3).toFixed(1)}" rx="0.8" fill="${col}" opacity="${op}"${b.live ? ` stroke="#E8EDF2" stroke-width="0.6" stroke-dasharray="1.6 1.6"` : ''}/>`;
    const vh = ((b.vol || 0) / maxVol) * (VBOT - VTOP);
    s += `<rect x="${(cx - cw / 2).toFixed(1)}" y="${(VBOT - vh).toFixed(1)}" width="${cw.toFixed(1)}" height="${Math.max(vh, 0.8).toFixed(1)}" rx="0.8" fill="${col}" opacity="${b.live ? 0.18 : 0.26}"/>`;
  }

  /* 均线：周期越长，均线越短 */
  const maN = (PERIOD_META[period] || PERIOD_META.D).ma;
  if (maN > 0 && n > maN) {
    let pts = '';
    let lastMA = 0;
    for (let i = maN - 1; i < n; i++) {
      let sum = 0;
      for (let k = i - maN + 1; k <= i; k++) sum += bars[k].close;
      lastMA = sum / maN;
      pts += `${(PADL + step * i + step / 2).toFixed(1)},${y(lastMA).toFixed(1)} `;
    }
    s += `<polyline points="${pts}" fill="none" stroke="#D29922" stroke-width="1.3" stroke-linejoin="round" opacity="0.8"/>`;
    s += `<text x="${W - PADR}" y="${PTOP + 9}" text-anchor="end" font-size="8" fill="#D29922" opacity="0.85" font-family="ui-monospace,monospace">MA${maN} ${lastMA.toFixed(2)}</text>`;
  }

  /* X 轴时间标签：固定取 4 个，首尾必有 */
  const ticks = n <= 4 ? [...Array(n).keys()] : [0, Math.round((n - 1) * 0.34), Math.round((n - 1) * 0.67), n - 1];
  ticks.forEach((i) => {
    const cx = PADL + step * i + step / 2;
    s += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle" font-size="8.5" fill="#5C6672" font-family="ui-monospace,monospace">${barLabel(bars[i], period)}</text>`;
  });

  /* 十字线（默认隐藏，由交互点亮） */
  s += `<g id="kx" opacity="0"><line id="kx-line" x1="0" y1="${PTOP}" x2="0" y2="${VBOT}" stroke="#8B949E" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/><circle id="kx-dot" cx="0" cy="0" r="2.8" fill="#E8EDF2"/></g>`;

  __KGEO = { PADL, step, n, W, H, bars, period, y, PTOP, VBOT };

  return `
    <div class="k-wrap" id="kwrap">
      <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>
      <div class="k-tip" id="ktip"></div>
    </div>`;
}

function bindKline() {
  const wrap = document.getElementById('kwrap');
  if (!wrap || !__KGEO) return;
  const tip = document.getElementById('ktip');
  const g = document.getElementById('kx');
  const line = document.getElementById('kx-line');
  const dot = document.getElementById('kx-dot');
  if (!tip || !g) return;

  const show = (ev) => {
    const r = wrap.getBoundingClientRect();
    const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
    const vx = (px / r.width) * __KGEO.W;
    let i = Math.round((vx - __KGEO.PADL - __KGEO.step / 2) / __KGEO.step);
    i = Math.max(0, Math.min(__KGEO.n - 1, i));
    const b = __KGEO.bars[i];
    const cx = (__KGEO.PADL + __KGEO.step * i + __KGEO.step / 2).toFixed(1);

    g.style.opacity = 1;
    line.setAttribute('x1', cx);
    line.setAttribute('x2', cx);
    dot.setAttribute('cx', cx);
    dot.setAttribute('cy', __KGEO.y(b.close).toFixed(1));

    const chg = b.close - b.open;
    const pct = b.open ? (chg / b.open) * 100 : 0;
    const dlg = b.from === b.to ? b.from : `${b.from} → ${b.to}`;
    tip.innerHTML = `
      <div class="kt-date">${dlg}${b.live ? ' · 未收盘' : ''}</div>
      <div class="kt-price ${chg >= 0 ? 'up' : 'down'}">${b.close.toFixed(2)}<span>${chg >= 0 ? '+' : ''}${chg.toFixed(2)} · ${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span></div>
      <div class="kt-row"><span>净缺口</span><b class="${b.net > 0 ? 'up' : 'down'}">${b.net > 0 ? '+' : ''}${b.net} kcal</b></div>
      <div class="kt-row"><span>摄入 / 消耗</span><b>${Math.round(b.intake)} / ${Math.round(b.burn)}</b></div>`;
    tip.style.opacity = 1;
    const left = Math.min(Math.max(px - 58, 4), r.width - 124);
    tip.style.left = left + 'px';
    tip.style.top = '6px';
  };

  const hide = () => { g.style.opacity = 0; tip.style.opacity = 0; };
  wrap.addEventListener('pointerdown', show);
  wrap.addEventListener('pointermove', (e) => { if (e.pointerType === 'touch' || e.buttons) show(e); });
  wrap.addEventListener('pointerleave', hide);
  wrap.addEventListener('pointercancel', hide);
}

/* 大盘方块的补间：从上一帧的几何插值到这一帧，460ms 三次缓出。
   为什么不用 CSS transition / SMIL：整页重绘会把 SVG 元素整个换掉，
   新元素没有"上一帧"可过渡；SMIL 又挂在文档时间轴上，begin=0s 时早就跑完了。
   所以自己按 data-from 记下的起点做 rAF 插值，重绘多少次都不受影响。 */
function bindBoardAnim() {
  if (typeof requestAnimationFrame !== 'function') return;
  const list = Array.prototype.slice.call(
    document.querySelectorAll('.bd-canvas rect[data-from]')
  );
  if (!list.length) return;

  const items = list.map((el) => {
    const f = String(el.getAttribute('data-from')).split(',').map(Number);
    return {
      el,
      from: { x: f[0], y: f[1], w: f[2], h: f[3] },
      to: {
        x: Number(el.getAttribute('x')),
        y: Number(el.getAttribute('y')),
        w: Number(el.getAttribute('width')),
        h: Number(el.getAttribute('height'))
      }
    };
  });

  const DUR = 460;
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  /* t0 用 -1 当哨兵：performance.now() 完全可能从 0 起，用 falsy 判断会每帧重置 */
  let t0 = -1;

  const frame = (now) => {
    if (t0 < 0) t0 = now;
    const k = Math.min(1, (now - t0) / DUR);
    const e = ease(k);
    for (const it of items) {
      const f = it.from, t = it.to;
      it.el.setAttribute('x', (f.x + (t.x - f.x) * e).toFixed(2));
      it.el.setAttribute('y', (f.y + (t.y - f.y) * e).toFixed(2));
      it.el.setAttribute('width', Math.max(0.5, f.w + (t.w - f.w) * e).toFixed(2));
      it.el.setAttribute('height', Math.max(0.5, f.h + (t.h - f.h) * e).toFixed(2));
    }
    if (k < 1) requestAnimationFrame(frame);
    else items.forEach((it) => it.el.removeAttribute('data-from'));
  };
  requestAnimationFrame(frame);
}


/* 自开仓以来累计净缺口 → 理论体重；与实际报价的差就是"水分基差" */
function basisKg() {
  const upto = state.selDate;
  const useLogs = selIsToday() || state.logs.length > 0;
  const since = HISTORY
    .filter((d) => d.date >= OPEN_DAY && (useLogs ? d.date < upto : d.date <= upto))
    .reduce((s, d) => s + d.net, 0) + (useLogs ? net() : 0);
  return liveWeight() - (OPEN_PRICE + since / KCAL_PER_KG);
}

function liveStreak() {
  const ds = ALL_DAYS();
  let k = 0;
  for (let i = ds.length - 1; i >= 0; i--) {
    if (ds[i].net < 0) k++;
    else break;
  }
  return k;
}

/* ================= 体重波动曲线 =================
   这张图要回答的不是「我瘦了多少」，而是「我看到的数字到底是不是真的」。

   日体重 = 趋势（缺口的积分）+ 噪音（水、盐、糖原、肠道内容物）
   噪音量级通常是真实趋势的 10~20 倍，所以图里同时画四条：

     细灰线  每日秤上的数字          → 噪音，别当真
     金 线   7 日均线                → 把噪音摊平后的趋势
     绿虚线  理论体重                → 按累计缺口折算，完全不受水分影响
     阴影带  均线 ± 1σ（残差标准差） → 正常波动区间，落在里面都算正常

   判定标准写在下面：真实趋势斜率 / 日噪音 σ = 信号噪音比。
   这个比值小于 0.1 时，任何单日读数都不该被当成趋势。 */

function volWindow(nDays) {
  const all = ALL_DAYS();
  return all.slice(Math.max(0, all.length - nDays));
}

function volStats(days) {
  const n = days.length;
  if (n < 8) return null;

  /* 7 日均线 */
  const ma = days.map((_, i) => {
    const from = Math.max(0, i - 6);
    let sum = 0;
    for (let k = from; k <= i; k++) sum += days[k].close;
    return sum / (i - from + 1);
  });

  /* 残差 = 当日收盘 − 均线。它的标准差就是「日常噪音」的真实量级。
     这是这张图的关键统计量，比体重本身的方差有意义得多。 */
  const resid = days.map((d, i) => d.close - ma[i]);
  const meanR = resid.reduce((s, v) => s + v, 0) / n;
  const sd = Math.sqrt(resid.reduce((s, v) => s + (v - meanR) ** 2, 0) / n);

  /* 真实趋势：对收盘价做最小二乘。噪音零均值，所以斜率不受其影响 */
  const xm = (n - 1) / 2;
  const ym = days.reduce((s, d) => s + d.close, 0) / n;
  let num = 0, den = 0;
  days.forEach((d, i) => { num += (i - xm) * (d.close - ym); den += (i - xm) ** 2; });
  const slopeDay = den ? num / den : 0;

  /* 理论体重：从窗口首日收盘出发，按累计净缺口折算 */
  let acc = 0;
  const theory = days.map((d, i) => {
    if (i > 0) acc += d.net;
    return days[0].close + acc / KCAL_PER_KG;
  });

  const diff = days.map((d, i) => (i ? d.close - days[i - 1].close : 0)).slice(1);
  const inBand = days.filter((d, i) => Math.abs(resid[i] - meanR) <= sd).length;

  return {
    n, ma, resid, sd, meanR, slopeDay, theory,
    maxUp: Math.max(...diff), maxDown: Math.min(...diff),
    inBandPct: (inBand / n) * 100,
    weekly: slopeDay * 7,
    snr: sd > 0 ? Math.abs(slopeDay) / sd : 0,
    maFirst: ma[0], maLast: ma[n - 1],
    closeFirst: days[0].close, closeLast: days[n - 1].close,
    theoryLast: theory[n - 1]
  };
}

function renderVolCurve(days, st, range) {
  const W = 372, H = 196;
  const PADL = 46, PADR = 14, PTOP = 12, PBOT = 168;
  const XW = W - PADL - PADR;
  const n = days.length;
  const x = (i) => PADL + (XW * i) / Math.max(1, n - 1);

  const vals = [];
  days.forEach((d, i) => vals.push(d.close, st.ma[i] - st.sd, st.ma[i] + st.sd, st.theory[i]));
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const sp = hi - lo || 1;
  lo -= sp * 0.08; hi += sp * 0.08;
  const y = (v) => PBOT - ((v - lo) / (hi - lo)) * (PBOT - PTOP);

  let s = '';

  /* 横向网格 */
  for (let g = 0; g < 4; g++) {
    const v = lo + ((hi - lo) * g) / 3;
    const yy = y(v).toFixed(1);
    s += `<line x1="${PADL}" y1="${yy}" x2="${W - PADR}" y2="${yy}" stroke="#1C232B" stroke-width="1"/>`;
    s += `<text x="${PADL - 6}" y="${(+yy + 3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#5C6672" font-family="ui-monospace,monospace">${v.toFixed(2)}</text>`;
  }

  /* 波动带：均线 ± 1σ */
  if (st.sd > 0) {
    const up = st.ma.map((v, i) => `${x(i).toFixed(1)},${y(v + st.sd).toFixed(1)}`);
    const dn = st.ma.map((v, i) => `${x(i).toFixed(1)},${y(v - st.sd).toFixed(1)}`).reverse();
    s += `<polygon points="${up.join(' ')} ${dn.join(' ')}" fill="#5B9BD5" opacity="0.1"/>`;
    s += `<polyline points="${up.join(' ')}" fill="none" stroke="#5B9BD5" stroke-width="0.6" opacity="0.25" stroke-dasharray="2 3"/>`;
    s += `<polyline points="${dn.join(' ')}" fill="none" stroke="#5B9BD5" stroke-width="0.6" opacity="0.25" stroke-dasharray="2 3"/>`;
  }

  /* 理论体重线（按缺口折算，不受水分影响） */
  s += `<polyline points="${st.theory.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="#3DD68C" stroke-width="1.3" stroke-dasharray="6 3" opacity="0.85"/>`;

  /* 日收盘：点少的时候连点一起画，点多的时候只留线 */
  s += `<polyline points="${days.map((d, i) => `${x(i).toFixed(1)},${y(d.close).toFixed(1)}`).join(' ')}" fill="none" stroke="#8A94A0" stroke-width="0.9" opacity="0.62"/>`;
  if (n <= 100) {
    days.forEach((d, i) => {
      s += `<circle cx="${x(i).toFixed(1)}" cy="${y(d.close).toFixed(1)}" r="1.3" fill="#A8B2BE" opacity="0.75"/>`;
    });
  }

  /* 7 日均线：这条才是趋势 */
  s += `<polyline points="${st.ma.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}" fill="none" stroke="#D29922" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;

  /* 最新一点加重 */
  s += `<circle cx="${x(n - 1).toFixed(1)}" cy="${y(st.maLast).toFixed(1)}" r="2.6" fill="#D29922"/>`;

  /* 两端日期：跨年的窗口要带年份，否则 10/27 → 10/26 看不出是一年 */
  const fmtX = (d) => (range >= 180 ? d.slice(2, 7).replace('-', '/') : d.slice(5).replace('-', '/'));
  s += `<text x="${PADL}" y="${PBOT + 14}" font-size="8" fill="#5C6672" font-family="ui-monospace,monospace">${fmtX(days[0].date)}</text>`;
  s += `<text x="${W - PADR}" y="${PBOT + 14}" text-anchor="end" font-size="8" fill="#5C6672" font-family="ui-monospace,monospace">${fmtX(days[n - 1].date)}</text>`;
  s += `<text x="${W - PADR}" y="${PTOP - 2}" text-anchor="end" font-size="8" fill="#D29922" opacity="0.8" font-family="ui-monospace,monospace">MA7 ${st.maLast.toFixed(2)}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${s}</svg>`;
}

/* 波动卡片 */
function volCard() {
  const range = state.volRange || 30;
  const days = volWindow(range);
  const st = volStats(days);
  if (!st) return '';

  const RANGES = [[30, '30 天'], [90, '90 天'], [365, '1 年']];
  const tabs = RANGES.map(
    ([v, t]) => `<button class="${range === v ? 'on' : ''}" data-vol="${v}">${t}</button>`
  ).join('');

  const trendCls = st.weekly >= 0 ? 'up' : 'down';
  const noiseX = st.snr > 0 ? Math.round(1 / st.snr) : 0;
  const realCls = st.slopeDay < 0 ? 'down' : 'up';

  return `
    <div class="card">
      <div class="card-head">
        <span class="card-title">体重波动</span>
        <div class="vol-tabs">${tabs}</div>
      </div>

      <div class="vol-wrap">${renderVolCurve(days, st, range)}</div>

      <div class="vol-legend">
        <span><i class="vol-line" style="border-top-color:#8A94A0"></i>每日称重</span>
        <span><i class="vol-line" style="border-top-color:#D29922"></i>7 日均线</span>
        <span><i class="vol-line" style="border-top-color:#3DD68C;border-top-style:dashed"></i>理论体重</span>
        <span><i class="vol-band" style="background:rgba(91,155,213,.3)"></i>正常波动带</span>
      </div>

      <div class="vol-grid">
        <div class="vol-cell">
          <span>日波动 σ</span>
          <b>±${st.sd.toFixed(2)}<em>kg</em></b>
        </div>
        <div class="vol-cell">
          <span>真实趋势</span>
          <b class="${realCls}">${signTxt(st.weekly, 2)}<em>kg/周</em></b>
        </div>
        <div class="vol-cell">
          <span>最大单日涨 / 跌</span>
          <b>+${st.maxUp.toFixed(2)} / ${st.maxDown.toFixed(2)}</b>
        </div>
        <div class="vol-cell">
          <span>信号噪音比</span>
          <b>${st.snr > 0 ? `1 : ${noiseX}` : '—'}</b>
        </div>
      </div>

      <div class="vol-note">
        ${
          st.snr < 0.12
            ? `这 ${range} 天里，真实趋势每周只有 ${Math.abs(st.weekly).toFixed(2)} kg，而单日噪音有 ±${st.sd.toFixed(2)} kg —— <b>噪音是信号的约 ${noiseX} 倍</b>。这就是为什么连吃三天干净饭、秤上却没动是正常的，也是为什么单看某一天毫无意义。`
            : `这 ${range} 天趋势明确（每周 ${signTxt(st.weekly, 2)} kg），单日噪音 ±${st.sd.toFixed(2)} kg 没有淹没它。`}
        ${st.inBandPct.toFixed(0)}% 的天数落在波动带内${st.inBandPct > 55 && st.inBandPct < 80 ? '（符合 ±1σ 的理论期望 68%，说明这条带是可信的）' : ''}。
        理论体重与实际相差 ${signTxt(st.maLast - st.theoryLast, 2)} kg，这部分就是还没兑现的基差。
      </div>
    </div>`;
}

/* ================= 热量盈余卡片 ================= */
function budgetCard() {
  const b = budgetInfo();
  const inK = intake();
  const sur = inK - b.kcal;
  const pctOf = (v) => (b.kcal > 0 ? Math.min(100, (v / b.kcal) * 100) : 0);

  /* 构成条：消耗与摄入两根，共用同一比例尺，预算线贯穿两根。
     原来把摄入和消耗塞进同一条，视觉上会误读成「加起来」，所以拆成两行。 */
  const scaleMax = Math.max(b.kcal, inK, b.bmr + b.neat + b.exercise) * 1.02;
  const w = (v) => Math.max(0, (v / scaleMax) * 100).toFixed(2);
  const markAt = (b.kcal / scaleMax) * 100;

  const modeTxt = b.mode === 'auto' ? '按身体数据测算' : '手动指定';
  const flowTxt =
    b.mode === 'auto'
      ? `基础代谢 ${b.bmr} + 日常活动 ${b.neat} + 运动 ${b.exercise} − 缺口 ${b.deficit}`
      : '固定预算，不随今日运动变化';

  return `
    <div class="card">
      <div class="card-head">
        <span class="card-title">今日热量</span>
        <span class="card-note" data-view="profile" data-pftab="set" style="cursor:pointer;color:var(--gold)">${modeTxt} · 改设置 ›</span>
      </div>

      <div class="surplus-row">
        <span class="surplus-num ${sur > 0 ? 'up' : sur < 0 ? 'down' : 'flat'}">${sur > 0 ? '+' : ''}${sur}</span>
        <span style="font-size:11px;color:var(--muted);line-height:1.5">
          kcal ${sur > 0 ? '盈余<br>超出预算' : '剩余<br>还没吃满'}<br>
          <span style="color:var(--dim);font-size:10px">预算 ${b.kcal} / 已吃 ${inK}</span>
        </span>
      </div>

      <div class="bud-two">
        <span class="bud-tag">消耗</span>
        <div class="bud-line">
          <i style="width:${w(b.bmr)}%;background:rgba(229,72,77,.3)"></i>
          <i style="width:${w(b.neat)}%;background:rgba(229,72,77,.52)"></i>
          <i style="width:${w(b.exercise)}%;background:rgba(229,72,77,.78)"></i>
          <span class="bud-mark" style="left:${markAt}%"></span>
        </div>
        <span class="bud-tag">摄入</span>
        <div class="bud-line">
          <i style="width:${w(inK)}%;background:${sur > 0 ? 'rgba(61,214,140,.8)' : 'rgba(61,214,140,.45)'}"></i>
          <span class="bud-mark" style="left:${markAt}%"></span>
        </div>
      </div>

      <div class="bud-scale">
        <span>0</span>
        <span>${Math.round(scaleMax)} kcal</span>
      </div>

      <div class="bud-legend">
        <span><i class="dot" style="background:rgba(229,72,77,.35)"></i>基础代谢 <b>${b.bmr}</b></span>
        <span><i class="dot" style="background:rgba(229,72,77,.58)"></i>日常活动 <b>${b.neat}</b></span>
        <span><i class="dot" style="background:rgba(229,72,77,.85)"></i>运动 <b>${b.exercise}</b></span>
        <span><i class="dot" style="background:rgba(61,214,140,.7)"></i>已吃 <b>${inK}</b></span>
        <span style="margin-left:auto;color:var(--dim)">竖线 = 预算 ${b.kcal}</span>
      </div>

      <div class="vol-note" style="margin-top:11px">
        ${flowTxt} = 预算 <b>${b.kcal}</b> kcal。<br>
        ${
          b.capped
            ? `⚠️ 按公式算出来只有 ${b.raw} kcal，低于安全下限 ${b.floor}，已自动抬到 ${b.kcal}。再往下压，掉的就不只是脂肪了。`
            : `已吃 ${inK}，${sur > 0 ? `超了 ${sur} kcal，相当于多吃了 ${(sur / 7700 * 1000).toFixed(0)} g 脂肪` : `还能吃 ${Math.abs(sur)} kcal`}。<br>
        注意「盈余」和「净缺口」不是一回事：盈余是相对预算的偏离，净缺口是摄入减真实消耗，换算成盈亏是 ${net() > 0 ? `（今天 ${profitTxt(net())}，方向反了）` : `（今天 ${profitTxt(net())}，缺口成立）`}。`
        }
      </div>
    </div>`;
}

/* ================= 今日大盘：方块面积 ∝ 热量 =================
   把当天的能量流画成一张 treemap：上区是卖盘（消耗），下区是买盘（摄入），
   两区高度比 = 两边热量比，所以整张图本身就是一个天平 ——
   哪边占据的面积更大，哪边就是今天的主导力量。中间那条就是净额。

   为什么不用横向进度条：进度条共享一条时间轴，只能表达"相对最大值"，
   而面积的直觉是"总量的几分之一"，正好对应热量这件事。 */

/* 递归二分切分：每次沿长边切一刀，让两半面积比 = 价值和比。
   切分方向选长边，能让块逐渐趋近正方形 —— 这是 treemap 可读性的关键。 */
function squarify(items, x, y, w, h, out = []) {
  const total = items.reduce((s, i) => s + i.v, 0);
  if (!items.length || total <= 0 || w <= 0 || h <= 0) return out;
  if (items.length === 1) {
    out.push({ label: items[0].label, v: items[0].v, x, y, w, h });
    return out;
  }
  let acc = 0;
  let cut = 1;
  for (let i = 0; i < items.length - 1; i++) {
    acc += items[i].v;
    cut = i + 1;
    if (acc >= total / 2) break;
  }
  const g1 = items.slice(0, cut);
  const g2 = items.slice(cut);
  const r = acc / total;
  if (w >= h) {
    squarify(g1, x, y, w * r, h, out);
    squarify(g2, x + w * r, y, w - w * r, h, out);
  } else {
    squarify(g1, x, y, w, h * r, out);
    squarify(g2, x, y + h * r, w, h - h * r, out);
  }
  return out;
}

const MONO_F = 'ui-monospace,SFMono-Regular,Menlo,monospace';

/* 按实际字宽估算再截断：中文约等于 1 个字号宽，ASCII 约 0.56 个。
   统一按字符数截断会误伤中文（"日常活动 ×1.3" 会被截成"日常活动 …"）。 */
function fitText(str, maxW, fs) {
  const wide = (s) => [...s].reduce((a, c) => a + (/[\x00-\xff]/.test(c) ? fs * 0.56 : fs), 0);
  if (wide(str) <= maxW) return str;
  let out = '';
  for (const ch of str) {
    if (wide(out + ch + '…') > maxW) break;
    out += ch;
  }
  return out + '…';
}

/* 上一帧每块的几何。买入一笔之后，那一块要「从昨天的尺寸长到今天」，
   而不是整页刷一下就换个数字 —— 补间的起点就存在这张表里。
   键带上序号，因为同一天可能记了两笔「慢跑」。 */
let __BMEMO = { ctx: '', buy: {}, sell: {} };
/* ctx 变了（换交易日 / 换今日-月度口径）就不补间：那不是同一张图的变化 */
let __BANIM = false;

/* 一块区域内的挤压方块（返回 rect + text 片段，便于两张拼成一整张画布）。
   面积严格 ∝ 热量，块间只留 2.2px 缝，文字压在左上角 —— 这三条合起来才有
   "被挤在一起"的物理感：占比大的块颜色更沉、更实，占比小的块缩成一条，
   连数字都放不下时就是一块纯色，被大的吃掉。

   每块包在一个 <g data-view> 里：买盘点进「买入」、卖盘点进「卖出」，
   在那儿增删一笔，回来这块就会长大或缩小 —— 方块和账本是同一份数据。 */
function blockMarkup(items, ox, oy, W, H, red, sign) {
  if (!items.length || H <= 0 || W <= 0) return '';
  const GAP = 2.2;
  const hue = red ? 152 : 357;
  const sat = red ? 71 : 77;
  const baseL = red ? 40 : 49;
  const spanL = red ? 13 : 8;
  const total = items.reduce((s, i) => s + i.v, 0);
  if (total <= 0) return '';
  const blocks = squarify(items.slice().sort((a, b) => b.v - a.v), 0, 0, W, H);
  const side = red ? 'buy' : 'sell';
  const memo = __BMEMO[side];
  const seen = Object.create(null);

  let s = '';
  for (const b of blocks) {
    if (b.v <= 0) continue;
    const x = ox + b.x + GAP / 2, y = oy + b.y + GAP / 2;
    const w = b.w - GAP, h = b.h - GAP;
    if (w < 1 || h < 1) continue;

    const nm0 = String(b.label);
    seen[nm0] = (seen[nm0] || 0) + 1;
    const key = nm0 + '#' + seen[nm0];
    const prev = memo[key];

    /* 三种情况：老块挪了位置/变了大小 → 从旧几何插值；
       新块 → 从自己的中心长出来；没变 → 不动，一个 data-from 都不写。 */
    let from = null, isNew = false;
    if (__BANIM) {
      if (prev) {
        if (
          Math.abs(prev.x - x) > 0.35 || Math.abs(prev.y - y) > 0.35 ||
          Math.abs(prev.w - w) > 0.35 || Math.abs(prev.h - h) > 0.35
        ) from = prev;
      } else {
        isNew = true;
        from = { x: x + w / 2 - 0.6, y: y + h / 2 - 0.6, w: 1.2, h: 1.2 };
      }
    }
    memo[key] = { x, y, w, h, v: b.v };

    const share = b.v / total;
    /* 份额越大 → 亮度越低 → 色块越"重"；小块越浅，像被压薄 */
    const lum = baseL + spanL * (1 - Math.pow(Math.min(1, share), 0.5));
    const dataFrom = from
      ? ` data-from="${from.x.toFixed(2)},${from.y.toFixed(2)},${from.w.toFixed(2)},${from.h.toFixed(2)}"`
      : '';

    s += `<g class="bd-blk${isNew ? ' bd-flash' : ''}" data-view="${red ? 'nearby' : 'log'}">`;
    s += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${w.toFixed(2)}" height="${h.toFixed(2)}" fill="hsl(${hue} ${sat}% ${lum.toFixed(1)}%)"${dataFrom}/>`;

    const iw = w - 14;
    const ih = h - 10;
    const nx = x + 8;
    /* 三级信息密度：大块名称+数值+单位，中块名称+数值，小块只剩数值 */
    if (iw >= 42 && ih >= 30) {
      const fs = Math.min(13.5, Math.max(10.5, h / 9));
      let nm = fitText(b.label, iw + 4, fs);
      /* 全名放不下时先去掉末尾括号（"奶茶（三分糖）" → "奶茶"），
         比留一个"奶茶（…"干净得多 */
      if (nm.endsWith('…')) {
        const bare = b.label.replace(/[（(][^）)]*[）)]\s*$/, '');
        if (bare !== b.label) nm = fitText(bare, iw + 4, fs);
      }
      const ny = y + 7 + fs;
      s += `<text x="${nx.toFixed(1)}" y="${ny.toFixed(1)}" font-size="${fs.toFixed(1)}" font-weight="600" fill="#fff" fill-opacity="0.96">${esc(nm)}</text>`;
      if (ih >= 46) {
        const fs2 = Math.min(12, Math.max(9.5, h / 12));
        /* 不带 " kcal"：图例已经交代了单位，块内多这四个字符会把数字挤到断行 */
        s += `<text x="${nx.toFixed(1)}" y="${(ny + fs2 + 5).toFixed(1)}" font-size="${fs2.toFixed(1)}" font-weight="500" fill="#fff" fill-opacity="0.74" font-family="${MONO_F}">${sign}${b.v}</text>`;
      }
    } else if (iw >= 22 && ih >= 10) {
      const fs2 = Math.min(11, Math.max(8.5, h / 6));
      s += `<text x="${nx.toFixed(1)}" y="${(y + h / 2 + fs2 * 0.36).toFixed(1)}" font-size="${fs2.toFixed(1)}" font-weight="600" fill="#fff" fill-opacity="0.8" font-family="${MONO_F}">${sign}${b.v}</text>`;
    }
    s += '</g>';
  }
  return s;
}

/* 整张大盘画布：上半红（摄入）下半绿（消耗），中间一条 2.4px 缝。
   两区共用同一个 viewBox，所以高度比就是真实热量比 —— 这一条是整张图的语义地基。 */
function boardCanvas(buyItems, sellItems, W, H) {
  const buySum = buyItems.reduce((s, i) => s + i.v, 0);
  const sellSum = sellItems.reduce((s, i) => s + i.v, 0);
  const MID = 2.4;
  const { hb, hi } = boardHeights(sellSum, buySum, H - MID);
  const parts =
    blockMarkup(buyItems, 0, 0, W, hi, true, '+') +
    blockMarkup(sellItems, 0, hi + MID, W, hb, false, '-');
  if (!parts) {
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="10" fill="#4C5560">还没有今天的流水</text></svg>`;
  }
  /* 有块要动时给整张图挂 .bd-anim，块里的文字延后 0.2s 统一淡入：
     让文字跟着块一起飞会糊，等位置落定再显出来更干净 */
  const anim = parts.indexOf('data-from') >= 0;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"${anim ? ' class="bd-anim"' : ''}>${parts}</svg>`;
}

/* 两区高度：按热量比分配，但各留一点下限，
   否则某一边极小时会退化成一条线，用户会以为没数据。
   默认合计 172 是历史基准，实际渲染时按目标高度等比缩放。 */
function boardHeights(burnK, intakeK, total = 172) {
  const sum = burnK + intakeK;
  if (sum <= 0) return { hb: total / 2, hi: total / 2 };
  const MIN = (44 * total) / 172;
  let hb = (total * burnK) / sum;
  hb = Math.min(total - MIN, Math.max(MIN, hb));
  return { hb, hi: total - hb };
}

/* ================= 首页第一屏：大盘挤压方块 =================
   这张卡是打开 App 的第一眼，所以它得自己把话说完整：
   今天（或本月）到底是净空还是净多、离目标还差多少、钱花在哪儿了。
   两张口径共用同一套画布，切换只换数据，不换视觉语言 —— 这样"今日"和
   "月度"的比例可以直接隔屏对比。 */
function boardCard() {
  const isMonth = state.boardTab === 'month';
  const td = targetDeficit();
  const arc = archivedDay();
  /* 同一张图才补间：换交易日、切今日/月度、进出归档态都属于"换了张图"，直接落地 */
  const ctxKey = `${state.selDate}|${state.boardTab}|${arc ? 'a' : 'n'}`;
  __BANIM = __BMEMO.ctx === ctxKey;
  if (!__BANIM) __BMEMO = { ctx: ctxKey, buy: {}, sell: {} };
  const now = selDateObj();
  const y = now.getFullYear();
  const mo = now.getMonth() + 1;
  const dd = now.getDate();

  let buyItems, sellItems, gap, target, dayCount = 1, canvasH = 338;

  if (isMonth) {
    /* 月度口径：按月内自然周聚合，一周一块。
       为什么不按天：26 块挤在 360px 里只会碎成马赛克，数字全被裁断，
       而且日间热量本来就接近，反而看不出任何东西。折成 4~5 块之后，
       "哪一周吃爆了"是一眼就能看出来的事 —— 这也和 K 线的周线对得上。 */
    const list = ALL_DAYS().slice(-dd);
    dayCount = list.length;
    const buckets = [];
    list.forEach((d) => {
      const day = +d.date.slice(8);
      const wk = Math.ceil(day / 7);
      if (!buckets[wk]) {
        const s = (wk - 1) * 7 + 1;
        const e = Math.min(wk * 7, dd);
        buckets[wk] = { label: `第${wk}周`, intake: 0, burn: 0, net: 0 };
      }
      buckets[wk].intake += d.intake;
      buckets[wk].burn += d.burn;
      buckets[wk].net += d.net;
    });
    const rows = buckets.filter(Boolean);
    buyItems = rows.map((b) => ({ label: b.label, v: b.intake }));
    sellItems = rows.map((b) => ({ label: b.label, v: b.burn }));
    gap = Math.round(rows.reduce((s, b) => s + b.net, 0));
    target = td * dayCount;
    canvasH = 316;
  } else if (arc) {
    /* 归档日：没有逐笔明细，但历史序列里存了那天的宏量营养，
       所以摄入可以按蛋白/脂肪/碳水真实拆开 —— 这不是编的，是那天真吃了这么多。
       消耗只知道总数，按档案里"基础代谢 : 日常活动"的比例折算，
       多出来的部分归到"运动与活动"，这样两块加回去正好等于当天总消耗。 */
    const mp = arc.pro * 4, mf = arc.fat * 9, mc = arc.carb * 4;
    const rest = arc.intake - (mp + mf + mc);
    buyItems = [
      { label: '碳水', v: mc },
      { label: '脂肪', v: mf },
      { label: '蛋白', v: mp },
      ...(rest > 40 ? [{ label: '其他', v: rest }] : [])
    ];
    const bmrArc = Math.round(bmr() * (arc.burn / Math.max(1, tdee())));
    sellItems = [
      { label: '基础代谢', v: bmrArc },
      { label: '运动与活动', v: Math.max(0, arc.burn - bmrArc) }
    ];
    gap = arc.net;
    target = td;
  } else {
    /* 当日口径：卖盘 = 运动 + 基础代谢 + 日常活动，买盘 = 每一笔摄入 */
    const foods = state.logs.filter((l) => l.type === 'food');
    const burns = state.logs.filter((l) => l.type === 'burn');
    buyItems = foods.map((f) => ({ label: f.name, v: f.kcal }));
    sellItems = [
      ...burns.map((b) => ({ label: b.name, v: b.kcal })),
      { label: '基础代谢', v: bmr() },
      ...(neat() > 0 ? [{ label: '日常活动', v: neat() }] : [])
    ];
    gap = net();
    target = td;
  }

  const planGap = Math.round(gap + target);
  const planDone = planGap <= 0;
  /* 月度里"还差 11678"这种数字只会让人挫败，换成完成度更有意义 */
  const donePct = target > 0 ? Math.max(0, Math.min(999, Math.round((-gap / target) * 100))) : 100;
  const pillTxt = planDone ? '已达标' : isMonth ? `完成 ${donePct}%` : `还差 ${Math.abs(planGap)} kcal`;
  /* 缺口为负 = 赚，箭头朝上（和行情软件的涨势一致） */
  const arrow = gap < 0 ? '↗' : gap > 0 ? '↘' : '→';
  /* target 是计划缺口（正数 = 每天要造 500 的缺口）。按盈亏口径，缺口就是赚，所以显示 +500 */
  const targetTxt = `${target >= 0 ? '+' : '-'}${Math.abs(Math.round(target))}`;
  const dateTxt = isMonth ? `${y}年${mo}月 · 已过 ${dayCount} 天` : `${y}年${mo}月${dd}日`;

  return `
    <div class="bd-card">
      <div class="bd-top">
        <div>
          <div class="bd-sym">CAL·INDEX${isMonth ? ' · MTD' : ''}</div>
          <div class="bd-date">${dateTxt}</div>
        </div>
        <div>
          <div class="bd-sk">⚡ ${liveStreak()} 天连击</div>
          <div class="bd-sk2">保持缺口区间不中断</div>
        </div>
      </div>

      <div class="bd-gap">
        <div class="bd-gap-l">
          <span>${isMonth ? '本月净缺口' : selIsToday() ? '今日净缺口' : '当日净缺口'}</span>
          <div class="bd-gap-n ${profitCls(gap)}"><span>${arrow} ${profitTxt(gap)}</span><i>kcal</i></div>
        </div>
        <div class="bd-gap-r">
          <span>目标</span>
          <b>${targetTxt} kcal</b>
          <em class="bd-pill ${planDone ? 'ok' : 'bad'}">${pillTxt}</em>
        </div>
      </div>

      <div class="bd-tabs">

/* ================= 运动录入：草稿与局部同步 =================
   表单活在页面里，整页 render() 会重建 input，打断输入和焦点。
   所以输入过程中只更新草稿 + 局部 DOM，绝不 render。 */

function syncExDom() {
  const d = state.exDraft;
  const kcal = d.kcal == null ? metBurn(d.met, d.mins) : d.kcal;

  const setVal = (id, v) => {
    const el = $(id);
    if (!el || el === document.activeElement) return;   // 正在输入的那格不覆盖
    if (el.value !== String(v)) el.value = v;
  };
  setVal('ex-name', d.name);
  setVal('ex-met', d.met);
  setVal('ex-min', d.mins);
  setVal('ex-kcal', kcal);

  document.querySelectorAll('[data-ex]').forEach((b) => b.classList.toggle('on', Number(b.dataset.ex) === d.pick));
  document.querySelectorAll('[data-exmin]').forEach((b) => b.classList.toggle('on', Number(b.dataset.exmin) === d.mins));

  const fm = $('ex-formula');
  if (fm) fm.textContent = `(${d.met || 0} − 1) × ${fmt(state.weight, 1)}kg × ${((d.mins || 0) / 60).toFixed(2)}h`;

  const btn = $('ex-save');
  if (btn) btn.textContent = state.exEditId != null ? '保存修改' : `记入卖盘 · ${kcal} kcal`;
}

function pickEx(i) {
  const e = EXERCISES[i];
  if (!e) return;
  state.exDraft.pick = i;
  state.exDraft.name = e.name;
  state.exDraft.met = e.met;
  state.exDraft.kcal = null;        // 换项目就回到公式值，别把上一项的手改值带过来
  syncExDom();
}

function startEditEx(id) {
  const l = state.logs.find((x) => String(x.id) === String(id));
  if (!l) return;
  state.exEditId = l.id;
  state.exDraft = {
    pick: -1,
    name: l.name,
    met: Number(l.met) || 5,
    mins: Number(l.mins) || 30,
    kcal: l.kcal
  };
  render();
  const el = $('ex-name');
  if (el) el.focus();
}

function cancelEx() {
  state.exEditId = null;
  state.exDraft = blankDraft();
  render();
}

function saveEx() {
  const d = state.exDraft;
  const name = String(d.name || '').trim() || '运动';
  const mins = Math.round(Number(d.mins) || 0);
  const met = Number(d.met) || 0;
  const kcal = d.kcal == null ? metBurn(met, mins) : Math.round(Number(d.kcal) || 0);

  if (!mins) {
    toast('先填时长');
    if ($('ex-min')) $('ex-min').focus();
    return;
  }
  if (kcal <= 0) {
    toast('消耗要大于 0');
    if ($('ex-kcal')) $('ex-kcal').focus();
    return;
  }

  if (state.exEditId != null) {
    const l = state.logs.find((x) => String(x.id) === String(state.exEditId));
    if (l) Object.assign(l, { name, kcal, mins, met });
    state.exEditId = null;
    toast(`已更新 · 这条记 ${kcal} kcal`);
  } else {
    state.logs.push({ id: Date.now(), type: 'burn', name, kcal, mins, met });
    toast(`卖单成交 · -${kcal} kcal`);
  }
  /* 保留项目和时长，方便连着记第二组；只清掉手改的消耗值 */
  d.kcal = null;
  d.name = name;
  d.mins = mins;
  saveLogs();
  render();
}

/* ================= 逐日流水持久化 =================
   按日期分桶：盘口是当日概念，昨天的成交混进今天，净额和方块图都会错；
   但换到"补记昨天"的场景又必须能按日存，所以键是日期而不是"today"。 */
let DAY_STORE = {};

function loadDayStore() {
  const out = {};
  try {
    const raw = localStorage.getItem('calex.daylog.v2');
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object' && !Array.isArray(o)) {
        Object.keys(o).forEach((k) => { if (Array.isArray(o[k])) out[k] = o[k]; });
      }
      return out;
    }
    /* 老格式只有"当天"一条，迁移过来 */
    const old = localStorage.getItem('calex.daylog.v1');
    if (old) {
      const d = JSON.parse(old);
      if (d && d.date && Array.isArray(d.items)) out[d.date] = d.items;
    }
  } catch (e) {
    /* 隐私模式读不出来，当作空库 */
  }
  return out;
}

function saveLogs() {
  if (!state.selDate) return;
  if (state.logs.length) DAY_STORE[state.selDate] = state.logs;
  else delete DAY_STORE[state.selDate];      // 删光了就回到归档态
  try {
    localStorage.setItem('calex.daylog.v2', JSON.stringify(DAY_STORE));
    touchData('记一笔');
  } catch (e) {
    /* 隐私模式写不进去，忽略 */
  }
}

/* 换交易日：当前日的流水先落盘，再装载目标日 */
function switchDate(date) {
  if (!date || date === state.selDate) return;
  saveLogs();
  state.selDate = date;
  state.logs = (DAY_STORE[date] || []).slice();
  state.exEditId = null;
  state.exDraft = blankDraft();
  state.boardTab = 'today';
  render();
  if (date === todayStr()) toast('已回到今天');
  else if (archivedDay()) toast(`${date.slice(5)} 是归档日 · 只有汇总`);
  else toast(`已切到 ${date.slice(5)}`);
}

/* ================= 本地数据仓库：备份 / 恢复 / 快照 =================
   目标不是「数据存在浏览器里」，而是「数据在你手里」。localStorage 有三个现实短板：
   换设备带不走、清缓存就没了、iOS 长期不用会被系统回收。
   所以给三条出口 + 一条兜底：
     1) 手动备份：导出 JSON 文件 / 复制备份码 / 系统分享 —— 手机上总有一条路能走通
     2) 一键恢复：文件导入或粘贴备份码，可选「覆盖本机」或「合并进来」
     3) 自动快照：本机环形留最近 6 份，误删、误清都能退回去
     4) 恢复和清空之前先把当前状态存成快照，所以这两个动作本身也能反悔

   备份里只装「用户产生的数据」。食物基准库、演示行情、代码都不装：
   它们能从程序本身还原，塞进备份只会让文件变大、恢复变危险。
*/

const DATA_APP = 'calex';
const DATA_SCHEMA = 1;
const BACKUP_TAG = 'CALEX1:';
const SNAP_IDX_KEY = 'calex.snap.idx';
const SNAP_MAX = 6;
const SNAP_MIN_GAP = 6 * 60 * 1000;   // 自动快照最小间隔，避免每记一笔就存一份
const META_KEY = 'calex.meta.v1';

const DATA_PARTS = [
  { key: 'calex.daylog.v2', as: 'daylog', name: '逐日流水' },
  { key: 'calex.shops.v1', as: 'shops', name: '自选盘口' },
  { key: 'calex.myfoods.v1', as: 'foods', name: '我的食物' },
  { key: 'calex.profile.v1', as: 'profile', name: '设置与体重' }
];

/* ---- 底层读写：隐私模式下 localStorage 会抛异常，一律吞掉并降级 ---- */
function lsGet(k) {
  try { return localStorage.getItem(k); } catch (e) { return null; }
}
function lsSet(k, v) {
  try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
}
function lsDel(k) {
  try { localStorage.removeItem(k); } catch (e) { /* 忽略 */ }
}
function readJSON(k, fb) {
  const raw = lsGet(k);
  if (!raw) return fb;
  try {
    const o = JSON.parse(raw);
    return o == null ? fb : o;
  } catch (e) {
    return fb;
  }
}

function collectData() {
  const out = {};
  DATA_PARTS.forEach((p) => { out[p.as] = readJSON(p.key, null); });
  return out;
}

/* 备份里给用户看的摘要：多少天、多少笔、跨度多久 */
function dataStats(data) {
  const dl = (data && data.daylog) || {};
  const days = Object.keys(dl).filter((k) => Array.isArray(dl[k]) && dl[k].length).sort();
  const items = days.reduce((s, k) => s + dl[k].length, 0);
  return {
    days: days.length,
    items,
    shops: data && Array.isArray(data.shops) ? data.shops.length : 0,
    foods: data && Array.isArray(data.foods) ? data.foods.length : 0,
    first: days[0] || null,
    last: days[days.length - 1] || null
  };
}

function payloadBytes(data) {
  try { return JSON.stringify(data).length; } catch (e) { return 0; }
}

function fmtBytes(n) {
  if (!n) return '0 B';
  if (n < 1024) return n + ' B';
  return (n / 1024).toFixed(1) + ' KB';
}

function ago(ts) {
  if (!ts) return '从未';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return '刚刚';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  const d = Math.floor(s / 86400);
  return d < 30 ? d + ' 天前' : new Date(ts).toLocaleDateString('zh-CN');
}

function metaInfo() {
  const m = readJSON(META_KEY, {});
  return m && typeof m === 'object' ? m : {};
}
function setMeta(patch) {
  lsSet(META_KEY, JSON.stringify({ ...metaInfo(), ...patch }));
}

/* ---- 快照包 ---- */
function buildBackup() {
  const data = collectData();
  return {
    app: DATA_APP,
    schema: DATA_SCHEMA,
    savedAt: new Date().toISOString(),
    stats: dataStats(data),
    data
  };
}

/* ---- base64：备份码要能过微信、备忘录、短信，不能带换行和引号 ---- */
function toB64(str) {
  if (typeof btoa !== 'function' || typeof TextEncoder !== 'function') return '';
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function fromB64(b64) {
  if (typeof atob !== 'function') throw new Error('当前环境不支持备份码，请用文件备份');
  const bin = atob(String(b64).replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function backupCode() {
  return BACKUP_TAG + toB64(JSON.stringify(buildBackup()));
}

/* ---- 解析备份：任何字段都不信任，逐项校验后再用 ----
   这一步是安全阀。用户可能选错文件（比如选了自己的账单），
   直接 JSON.parse 就往 localStorage 里灌，轻则 App 白屏，重则数据被清空。 */
function parseBackup(text) {
  let s = String(text == null ? '' : text).trim();
  if (!s) throw new Error('内容是空的');
  if (s.indexOf(BACKUP_TAG) === 0) {
    try { s = fromB64(s.slice(BACKUP_TAG.length)); }
    catch (e) { throw new Error('备份码已损坏，可能复制时被截断了'); }
  }
  let obj = null;
  try { obj = JSON.parse(s); } catch (e) { throw new Error('这不是备份文件（无法解析）'); }
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('备份内容格式不对');

  const app = obj.app || (obj.data && obj.data.daylog ? DATA_APP : '');
  if (app !== DATA_APP) throw new Error('这看起来不是《卡路里交易所》的备份');

  const raw = obj.data && typeof obj.data === 'object' ? obj.data : obj;
  const clean = {};
  DATA_PARTS.forEach((p) => {
    const v = raw[p.as];
    if (v == null) return;
    if (p.as === 'daylog') {
      if (typeof v !== 'object' || Array.isArray(v)) return;
      const days = {};
      Object.keys(v).forEach((k) => {
        if (/^\d{4}-\d{2}-\d{2}$/.test(k) && Array.isArray(v[k])) {
          days[k] = v[k].filter((x) => x && typeof x === 'object');
        }
      });
      clean.daylog = days;
    } else if (p.as === 'profile') {
      if (typeof v === 'object' && !Array.isArray(v)) clean.profile = v;
    } else if (Array.isArray(v)) {
      clean[p.as] = v.filter((x) => x && typeof x === 'object');
    }
  });

  const stats = dataStats(clean);
  if (!stats.days && !stats.shops && !stats.foods && !clean.profile) {
    throw new Error('备份里没有可用数据');
  }
  return { savedAt: obj.savedAt || null, stats, data: clean };
}

/* ---- 合并：换新手机后先在本地记了几天，再恢复旧备份时用 ----
   流水按日期并集、同一笔按 id 去重；盘口按 id、食物按名字去重；
   设置保留本机的（用户在新机上已经调过了，不该被旧值盖掉）。 */
function mergeData(cur, inc) {
  const out = {};
  if (cur.daylog || inc.daylog) {
    const a = cur.daylog || {}, b = inc.daylog || {}, o = {};
    Object.keys(a).forEach((d) => { o[d] = a[d].slice(); });
    Object.keys(b).forEach((d) => {
      if (!o[d]) { o[d] = b[d].slice(); return; }
      const seen = new Set(o[d].map((x) => String(x.id)));
      b[d].forEach((x) => {
        if (!seen.has(String(x.id))) { o[d].push(x); seen.add(String(x.id)); }
      });
    });
    out.daylog = o;
  }
  const union = (a, b, keyOf) => {
    const m = new Map();
    (a || []).forEach((x) => m.set(keyOf(x), x));
    (b || []).forEach((x) => { const k = keyOf(x); if (!m.has(k)) m.set(k, x); });
    return Array.from(m.values());
  };
  out.shops = union(cur.shops, inc.shops, (s) => String(s.id || s.shop + '|' + s.dish));
  out.foods = union(cur.foods, inc.foods, (f) => String(f.n || f.name || ''));
  out.profile = cur.profile || inc.profile || null;
  return out;
}

function applyData(data) {
  const wrote = [];
  DATA_PARTS.forEach((p) => {
    const v = data[p.as];
    if (v == null) return;
    if (lsSet(p.key, JSON.stringify(v))) wrote.push(p.name);
  });
  return wrote;
}

/* ---- 自动快照：环形缓冲，最老的自动淘汰 ---- */
function snapIndex() {
  const a = readJSON(SNAP_IDX_KEY, []);
  return Array.isArray(a) ? a.filter((s) => s && s.id) : [];
}

function takeSnapshot(reason, force) {
  const data = collectData();
  const st = dataStats(data);
  if (!force && !st.days && !st.shops && !st.foods) return null;   // 空库不值得存
  const id = 's' + Date.now().toString(36) + Math.floor(Math.random() * 1000).toString(36);
  const rec = { at: Date.now(), reason: reason || '自动', stats: st };
  if (!lsSet('calex.snap.' + id, JSON.stringify({ ...rec, data }))) return null;  // 配额满

  const idx = snapIndex();
  idx.unshift({ id, ...rec });
  while (idx.length > SNAP_MAX) {
    const dead = idx.pop();
    lsDel('calex.snap.' + dead.id);
  }
  lsSet(SNAP_IDX_KEY, JSON.stringify(idx));
  return id;
}

/* 每次落盘后调用：同一次操作里连续记三笔，只留第一份，避免把环形缓冲冲爆 */
function autoSnap(reason) {
  const idx = snapIndex();
  const last = idx[0];
  if (last && Date.now() - last.at < SNAP_MIN_GAP) return;
  if (!last) { takeSnapshot('首次记录'); return; }
  const st = dataStats(collectData());
  const same = last.stats &&
    last.stats.items === st.items && last.stats.days === st.days &&
    last.stats.shops === st.shops && last.stats.foods === st.foods;
  if (same) return;
  takeSnapshot(reason);
}

/* 落盘钩子：快照出任何问题都不能影响用户记账这个主流程 */
function touchData(reason) {
  try { autoSnap(reason); } catch (e) { /* 配额满 / 隐私模式，忽略 */ }
}

function restoreSnapshot(id) {
  const raw = readJSON('calex.snap.' + id, null);
  if (!raw || !raw.data) throw new Error('这份快照已经不在了');
  takeSnapshot('回滚前');       // 先保一份现在的，回滚本身也能反悔
  const wrote = applyData(raw.data);
  if (!wrote.length) throw new Error('快照内容为空');
  reloadApp();
}

/* 内存里的 DAY_STORE / profile / state 都是启动时读出来的，
   改完 localStorage 必须整页重载才一致；测试桩里没有 location 就退回重绘。 */
function reloadApp() {
  if (typeof location !== 'undefined' && location && location.reload) {
    location.reload();
    return;
  }
  render();
}

/* ================= 数据页交互 ================= */

function copyText(text) {
  if (typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => toast('已复制到剪贴板'),
      () => legacyCopy(text)
    );
    return;
  }
  legacyCopy(text);
}
function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    document.body.removeChild(ta);
    if (!ok) throw new Error('copy failed');
    toast('已复制到剪贴板');
  } catch (e) {
    toast('复制失败，请长按选择文本');
  }
}

function exportBackupFile() {
  const text = JSON.stringify(buildBackup(), null, 2);
  const name = '卡路里交易所-备份-' + todayStr().replace(/-/g, '') + '.json';
  try {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      if (a.parentNode) a.parentNode.removeChild(a);
    }, 800);
    setMeta({ lastBackupAt: Date.now(), lastBackupKind: 'file', backupCount: (Number(metaInfo().backupCount) || 0) + 1 });
    toast('备份文件已导出 · ' + fmtBytes(text.length));
  } catch (e) {
    /* 老浏览器 / 某些 WebView 不允许下载，退回备份码 */
    copyText(backupCode());
    setMeta({ lastBackupAt: Date.now(), lastBackupKind: 'copy', backupCount: (Number(metaInfo().backupCount) || 0) + 1 });
  }
  render(true);
}

function copyBackup() {
  copyText(backupCode());
  setMeta({ lastBackupAt: Date.now(), lastBackupKind: 'copy', backupCount: (Number(metaInfo().backupCount) || 0) + 1 });
  render(true);
}

function shareBackup() {
  const code = backupCode();
  if (typeof navigator !== 'undefined' && navigator.share) {
    navigator.share({ title: '卡路里交易所 · 备份', text: code }).then(
      () => {
        setMeta({ lastBackupAt: Date.now(), lastBackupKind: 'share', backupCount: (Number(metaInfo().backupCount) || 0) + 1 });
        toast('已分享');
        render(true);
      },
      () => { /* 用户取消，不算备份 */ }
    );
    return;
  }
  copyText(code);
  toast('当前环境不支持系统分享，已复制备份码');
}

function pickBackupFile() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json,text/plain';
  inp.style.display = 'none';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => restoreFromText(String(rd.result || ''));
    rd.onerror = () => toast('这个文件读不出来');
    rd.readAsText(f);
  };
  document.body.appendChild(inp);
  inp.click();
  setTimeout(() => { if (inp.parentNode) inp.parentNode.removeChild(inp); }, 30000);
}

/* 恢复：先解析出摘要给用户看，再问覆盖还是合并。
   覆盖 = 换手机的标准动作；合并 = 已经在新机上记了几天，怕丢。 */
function restoreFromText(text) {
  let pack;
  try {
    pack = parseBackup(text);
  } catch (e) {
    alert('这个备份用不了：\n' + e.message);
    return;
  }
  const st = pack.stats;
  const when = pack.savedAt ? new Date(pack.savedAt).toLocaleString('zh-CN') : '未知时间';
  const mine = dataStats(collectData());
  const msg =
    '备份内容：' + st.days + ' 天记录 · ' + st.items + ' 笔流水 · ' + st.shops + ' 个盘口 · ' + st.foods + ' 条食物\n' +
    '备份时间：' + when + '\n\n' +
    '本机现有：' + mine.days + ' 天 · ' + mine.items + ' 笔\n\n' +
    '点「确定」= 覆盖本机（换手机选这个）\n' +
    '点「取消」= 合并进来（保留本机记录，只补缺的）';

  const overwrite = confirm(msg);
  try {
    takeSnapshot('恢复前', true);
    const data = overwrite ? pack.data : mergeData(collectData(), pack.data);
    const wrote = applyData(data);
    if (!wrote.length) throw new Error('没有写入任何数据');
    setMeta({ lastRestoreAt: Date.now() });
    alert('已恢复：' + wrote.join('、') + '\n页面马上刷新');
    reloadApp();
  } catch (e) {
    alert('恢复失败：' + e.message);
  }
}

function confirmRestoreSnapshot(id) {
  const rec = snapIndex().find((s) => s.id === id);
  if (!rec) return toast('这份快照已经不在了');
  const st = rec.stats || {};
  if (!confirm('回滚到「' + ago(rec.at) + '」的快照？\n' + (st.days || 0) + ' 天 · ' + (st.items || 0) + ' 笔 · 盘口 ' + (st.shops || 0) + ' 个\n\n当前记录会先被存成一份新快照。')) return;
  try {
    restoreSnapshot(id);
  } catch (e) {
    alert('回滚失败：' + e.message);
  }
}

function confirmWipe() {
  if (!confirm('清空本机全部数据？\n\n流水、盘口、食物库、设置都会被删掉。\n清空前会自动留一份快照，只能在这台手机上回滚。')) return;
  if (!confirm('再确认一次：真的清空？')) return;
  takeSnapshot('清空前', true);
  DATA_PARTS.forEach((p) => lsDel(p.key));
  lsSet(META_KEY, JSON.stringify({ lastBackupAt: 0, backupCount: 0 }));
  toast('已清空');
  reloadApp();
}

function askPersist() {
  if (typeof navigator === 'undefined' || !navigator.storage || !navigator.storage.persist) {
    return toast('当前浏览器不支持长期保存声明');
  }
  navigator.storage.persist().then(
    (ok) => {
      toast(ok ? '已获准长期保存，被系统回收的概率降低' : '系统没有同意，记得定期备份');
      probePersist();
    },
    () => toast('申请失败')
  );
}

/* 探针：主线程同步渲染时拿不到承诺结果，先占位再异步补上 */
function probePersist() {
  const el = document.getElementById('dp-persist');
  if (!el) return;
  if (typeof navigator === 'undefined' || !navigator.storage || !navigator.storage.persisted) {
    el.textContent = '不支持长期保存';
    return;
  }
  navigator.storage.persisted().then(
    (ok) => { el.textContent = ok ? '长期保存 · 已开启' : '点这里申请长期保存 ›'; },
    () => { el.textContent = '无法检测'; }
  );
}

function handleDataAction(act, el) {
  if (act === 'export') return exportBackupFile();
  if (act === 'copy') return copyBackup();
  if (act === 'share') return shareBackup();
  if (act === 'import') return pickBackupFile();
  if (act === 'do-paste') return restoreFromText(($('dp-code') || {}).value || '');
  if (act === 'snap') return confirmRestoreSnapshot(el.dataset.id);
  if (act === 'wipe') return confirmWipe();
  if (act === 'persist') return askPersist();
  if (act === 'refresh') return render(true);
}

/* ================= 复盘页：周报 / 月报 ================= */

/* 复盘窗口用滚动 7 天 / 30 天，而不是自然周月：
   自然周在周一打开只有 1 天数据，等于看到一张空报表。
   滚动窗口任何时候都有完整样本，环比口径也更稳定。 */
function periodRange(kind) {
  const end = selDateObj();
  const len = kind === 'W' ? 7 : 30;
  const start = new Date(end.getTime() - (len - 1) * DAY_MS);
  const prevEnd = new Date(start.getTime() - DAY_MS);
  const prevStart = new Date(prevEnd.getTime() - (len - 1) * DAY_MS);
  return {
    label: kind === 'W' ? '近 7 天' : '近 30 天',
    prevLabel: kind === 'W' ? '前 7 天' : '前 30 天',
    start, end, prevStart, prevEnd
  };
}

const sliceDays = (a, b) => {
  const s = ymd(a), e = ymd(b);
  return ALL_DAYS().filter((d) => d.date >= s && d.date <= e);
};

/* 实际体重变化用平滑值，不用首尾单日相减：
   单日噪音 ±0.9 kg，首尾相减能凭空造出 1.8 kg 的假趋势。 */
function smoothDelta(days, win) {
  const all = ALL_DAYS();
  const i0 = all.findIndex((d) => d.date === days[0].date);
  if (i0 < 0) return 0;
  const i1 = i0 + days.length - 1;
  const avg = (a, b) => {
    a = Math.max(0, a);
    let s = 0, c = 0;
    for (let i = a; i <= b; i++) { s += all[i].close; c++; }
    return c ? s / c : 0;
  };
  const k = Math.max(1, Math.min(win, Math.floor(days.length / 2)));
  return avg(i1 - k + 1, i1) - avg(i0 - k, i0 - 1);
}

function rangeStats(days) {
  if (!days.length) return null;
  const sum = (k) => days.reduce((s, d) => s + d[k], 0);
  const netSum = sum('net');
  const theory = netSum / KCAL_PER_KG;
  const actual = smoothDelta(days, days.length >= 20 ? 3 : 2);
  const proTarget = Math.round(state.weight * 1.8);
  const okDays = days.filter((d) => d.net < 0 && Math.abs(d.net) >= targetDeficit()).length;
  const longDays = days.filter((d) => d.net > 0).length;
  const proOk = days.filter((d) => d.pro >= proTarget * 0.9).length;
  const pick = (cmp) => days.reduce((a, b) => (cmp(b, a) ? b : a));
  return {
    n: days.length,
    netSum,
    theory,
    actual,
    basis: actual - theory,
    intake: sum('intake'),
    burn: sum('burn'),
    okDays,
    longDays,
    proOk,
    proTarget,
    avgNet: Math.round(netSum / days.length),
    avgIntake: Math.round(sum('intake') / days.length),
    avgBurn: Math.round(sum('burn') / days.length),
    strongest: pick((a, b) => a.net < b.net),      // 最大空头日
    weakest: pick((a, b) => a.net > b.net),        // 最大多头日
    eatMost: pick((a, b) => a.intake > b.intake),
    burnMost: pick((a, b) => a.burn > b.burn),
    days
  };
}

function calendarHTML(days) {
  if (!days.length) return '';
  const offset = (new Date(days[0].date + 'T00:00:00').getDay() + 6) % 7;
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<i class="cal-cell blank"></i>';
  days.forEach((d) => {
    const cls = d.net > 0 ? 'long' : Math.abs(d.net) >= targetDeficit() ? 'ok' : 'half';
    cells += `<i class="cal-cell ${cls}" data-day="${d.date}">${Number(d.date.slice(8))}</i>`;
  });
  return `<div class="cal">${['一', '二', '三', '四', '五', '六', '日']
    .map((w) => `<span class="cal-w">${w}</span>`)
    .join('')}${cells}</div>`;
}

function dayBarHTML(days) {
  const maxAbs = Math.max(...days.map((d) => Math.abs(d.net)), 1);
  return `<div class="dbars">${days
    .map((d) => {
      const h = Math.max(1.5, (Math.abs(d.net) / maxAbs) * 26);
      /* net>0 是净盈余（亏），画到 0 轴下方；net<0 是净缺口（赚），画到上方 */
      const cls = d.net > 0 ? 'loss' : 'gain';
      return `<div class="dbar"><i class="${cls}" style="height:${h.toFixed(1)}px"></i></div>`;
    })
    .join('')}</div>`;
}

function reviewSummary(st, label, prev, prevLabel) {
  const out = [];
  const kg = Math.abs(st.theory).toFixed(2);
  if (st.netSum < -0.01) {
    out.push(`${label}净缺口 +${Math.abs(st.netSum)} kcal，理论上该掉 ${kg} kg，实际秤上${st.actual <= 0 ? '掉了' : '涨了'} ${Math.abs(st.actual).toFixed(2)} kg。`);
  } else {
    out.push(`${label}是净盈余 ${profitTxt(st.netSum, 0)} kcal，方向反了，等于在做多自己。`);
  }
  if (Math.abs(st.basis) > 0.25) {
    out.push(
      st.basis > 0
        ? `基差 +${st.basis.toFixed(2)} kg，说明还有这部分水分没退，属于"已赚未兑"，别急着改策略。`
        : `基差 ${st.basis.toFixed(2)} kg，水分退得比理论快，短期好看，但也容易小幅反弹。`
    );
  }
  out.push(`达标 ${st.okDays} / ${st.n} 天${st.okDays >= st.n * 0.7 ? '，节奏保持得不错。' : st.okDays === 0 ? '，一天都没达标，先别谈长期，把明天做到就行。' : '，稳定性是接下来要修的地方。'}`);
  if (st.proOk < st.n * 0.5) {
    out.push(`蛋白质只有 ${st.proOk} 天达标（目标 ${st.proTarget}g）。热量控制住了但蛋白不够，掉的会有一部分是肌肉。`);
  }
  if (prev) {
    const diff = st.netSum - prev.netSum;
    out.push(`${prevLabel}净缺口 ${profitTxt(prev.netSum, 0)} kcal，本期${diff < 0 ? '多做出了 ' + Math.abs(diff) + ' kcal 的缺口' : '少了 ' + diff + ' kcal 的缺口'}。`);
  }
  return out;
}

function viewReview() {
  const kind = state.reviewPeriod;
  const r = periodRange(kind);
  const days = sliceDays(r.start, r.end);
  const prevDays = sliceDays(r.prevStart, r.prevEnd);
  const st = rangeStats(days);
  const pv = rangeStats(prevDays);

  if (!st) {
    return `<div class="empty">${r.label}还没有记录</div>`;
  }

  const lines = reviewSummary(st, r.label, pv, r.prevLabel);
  const rangeTxt = `${ymd(r.start).slice(5).replace('-', '/')} — ${ymd(r.end).slice(5).replace('-', '/')}`;
  const pctOk = Math.round((st.okDays / st.n) * 100);

  const cmpRow = (name, a, b, unit, invert, dp) => {
    const diff = a - b;
    const good = invert ? diff < 0 : diff > 0;
    const dec = dp == null ? 2 : dp;
    return `
      <div class="cmp-row">
        <span class="cmp-name">${name}</span>
        <span class="cmp-val">${a.toFixed(dec)}<em>${unit}</em></span>
        <span class="cmp-diff ${diff === 0 ? 'flat' : good ? 'down' : 'up'}">${diff > 0 ? '+' : ''}${diff.toFixed(dec)}</span>
      </div>`;
  };

  return `
    <div class="rv-head">
      <div class="pt-tabs">
        <button class="pt ${kind === 'W' ? 'on' : ''}" data-review="W">周报</button>
        <button class="pt ${kind === 'M' ? 'on' : ''}" data-review="M">月报</button>
      </div>
      <span class="rv-range">${rangeTxt}</span>
    </div>

    <div class="card rv-hero">
      <div class="rv-hero-top">
        <div>
          <div class="rv-hero-label">${r.label}累计净缺口</div>
          <div class="rv-hero-num ${profitCls(st.netSum)}">${profitTxt(st.netSum)}</div>
          <div class="rv-hero-unit">kcal · ${st.n} 天 · 日均 ${profitTxt(st.avgNet)}</div>
        </div>
        <div class="rv-hero-right">
          <div class="rv-kg ${signCls(st.theory)}">${signTxt(st.theory, 2)}<small>kg 理论</small></div>
          <div class="rv-kg2 ${signCls(st.actual)}">${signTxt(st.actual, 2)}<small>kg 实际</small></div>
        </div>
      </div>
      ${dayBarHTML(days)}
      <div class="bar-legend"><span>每根 = 一天，红为净缺口（赚），绿为净盈余（亏）</span></div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">达标日历</span>
        <span class="card-note">${st.okDays}/${st.n} 天达标 · ${pctOk}%</span>
      </div>
      ${calendarHTML(days)}
      <div class="cal-legend">
        <span><i class="dot ok"></i>达标</span>
        <span><i class="dot half"></i>有缺口但不够</span>
        <span><i class="dot long"></i>做多（净盈余）</span>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">成绩单</span>
        <span class="card-note">${r.label} vs ${r.prevLabel}</span>
      </div>
      ${cmpRow('净缺口', profitOf(st.netSum), pv ? profitOf(pv.netSum) : 0, ' kcal', false, 0)}
      ${cmpRow('体重实际变化', st.actual, pv ? pv.actual : 0, ' kg', true)}
      ${cmpRow('日均摄入', st.avgIntake, pv ? pv.avgIntake : 0, ' kcal', true)}
      ${cmpRow('日均消耗', st.avgBurn, pv ? pv.avgBurn : 0, ' kcal', false)}
      ${cmpRow('基差（水分）', st.basis, pv ? pv.basis : 0, ' kg', true)}
      <div class="cmp-note">实际变化取 3 日均值平滑，避免单日水分噪音被当成趋势。差值列：红色代表比上一期更好。</div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">多空贡献</span>
        <span class="card-note">${r.label}合计</span>
      </div>
      <div class="contrib">
        <div class="contrib-row">
          <span class="tag down">空</span>
          <div>
            <div class="contrib-t">最大空头日 ${st.strongest.date.slice(5).replace('-', '/')}</div>
            <div class="contrib-d">净缺口 ${st.strongest.net} kcal，摄入 ${st.strongest.intake} / 消耗 ${st.strongest.burn}</div>
          </div>
        </div>
        <div class="contrib-row">
          <span class="tag up">多</span>
          <div>
            <div class="contrib-t">最大多头日 ${st.weakest.date.slice(5).replace('-', '/')}</div>
            <div class="contrib-d">净盈余 +${st.weakest.net} kcal，摄入 ${st.weakest.intake} / 消耗 ${st.weakest.burn}</div>
          </div>
        </div>
        <div class="contrib-row">
          <span class="tag gold">量</span>
          <div>
            <div class="contrib-t">消耗最猛 ${st.burnMost.date.slice(5).replace('-', '/')}</div>
            <div class="contrib-d">总消耗 ${st.burnMost.burn} kcal，其中运动 ${st.burnMost.burn - tdee()} kcal</div>
          </div>
        </div>
        <div class="contrib-row">
          <span class="tag up">吃</span>
          <div>
            <div class="contrib-t">摄入最多 ${st.eatMost.date.slice(5).replace('-', '/')}</div>
            <div class="contrib-d">摄入 ${st.eatMost.intake} kcal，占本期总量 ${Math.round((st.eatMost.intake / st.intake) * 100)}%</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">${r.label}小结</span></div>
      <div class="summary">
        ${lines.map((l) => `<p>${l}</p>`).join('')}
      </div>
    </div>

    <div class="foot-note">
      周报统计最近 7 个交易日，月报统计最近 30 个交易日，均含今日。用滚动窗口而非自然周月，是为了避免月初、周一打开时只有一两天数据。<br>
      历史部分为演示数据，真实记录接入后口径不变。
    </div>`;
}

/* ================= 我的 / 热量设置 ================= */

const SEX_META = [
  { k: 'male', t: '男' },
  { k: 'female', t: '女' }
];

/* 测算结果区：单独渲染，输入时不重绘整页，避免打字打到一半丢焦点 */
function profileResultHTML() {
  const b = budgetInfo();
  const w = state.weight, h = Number(profile.height) || 170, a = Number(profile.age) || 30;
  const tMifflin = Math.round(bmrMifflin(w, h, a, profile.sex) * actFactor());
  const tHarris = Math.round(bmrHarris(w, h, a, profile.sex) * actFactor());
  const spread = Math.abs(tHarris - tMifflin);

  const td = targetDeficit();
  const weeklyKg = (td * 7) / KCAL_PER_KG;
  const sur = intake() - b.kcal;

  const rows = [
    ['基础代谢 BMR', `${b.bmr} kcal`, '躺着不动也要烧掉的量'],
    ['日常活动消耗', `${b.neat} kcal`, `BMR × ${actFactor()}，只含生活活动`],
    ['今日运动', `${b.exercise} kcal`, b.exercise ? '来自卖出里的训练记录' : '今天还没记训练'],
    ['今日预算', `${b.kcal} kcal`, b.mode === 'manual' ? '你手动指定' : '消耗 − 目标缺口'],
    ['计划每周变化', `${signTxt(weeklyKg, 2)} kg`, td > 0 ? `约 ${(weeklyKg).toFixed(2)} kg 脂肪` : '在增重 / 维持']
  ];

  return `
    ${rows.map(([k, v, d]) => `
      <div class="set-row">
        <div>
          <div class="set-label">${k}</div>
          <div class="set-sub">${d}</div>
        </div>
        <div style="text-align:right;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap">${v}</div>
      </div>`).join('')}

    <div class="vol-note" style="margin-top:10px;border-top:none;padding-top:0">
      估算区间：Mifflin ${tMifflin} ~ Harris-Benedict ${tHarris} kcal，两者相差 ${spread} kcal。
      这是公式本身的误差，不是算错 —— 真实值要靠连续两周的体重趋势反推校准。<br>
      今日已吃 ${intake()} kcal，${sur > 0 ? `超预算 ${sur} kcal。` : `还剩 ${-sur} kcal。`}
    </div>`;
}

/* 「我的」页：营养 + 设置 + 数据合成一页，顶部分段切换。
   营养原来是独立页签，但一天真正会反复看的是"还缺什么"，
   这和"我把预算设成多少"本来就是同一件事的两面，拆成两个页签反而要来回跳。
   数据（备份/恢复）也放这里：它属于"我的东西"，但不该出现在主导航上 ——
   天天看见的按钮会让人以为需要天天点。 */
const PF_TABS = [
  ['nutri', '营养'],
  ['set', '热量设置'],

];

function viewProfile() {
  const tab = PF_TABS.some((t) => t[0] === state.pfTab) ? state.pfTab : 'nutri';
  const seg = `<div class="seg">${PF_TABS.map(
    ([k, t]) => `<button class="${tab === k ? 'on' : ''}" data-pftab="${k}">${t}</button>`
  ).join('')}</div>`;
