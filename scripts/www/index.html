<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0E11">
<title>卡路里交易所 · CAL·EX</title>
<!-- 装到手机桌面（PWA）：装成 App 之后浏览器不会把存储当"临时站点数据"清掉，
     这比普通网页标签页可靠得多，也是"数据存在本地"能成立的前提。 -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卡路里交易所">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="description" content="把减脂当成一场做空：吃进去是买入，消耗是卖出，净缺口就是你的盈亏。">
<style>
  :root{
    --bg:#0B0E11; --surface:#151A21; --surface2:#1C232B; --border:#252D36;
    --text:#E8EDF2; --muted:#8B949E; --dim:#5C6672;
    --up:#3DD68C; --down:#E5484D; --gold:#D29922; --danger:#E5484D;
    --radius:14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#05070A;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text); display:flex; justify-content:center; min-height:100vh;
  }
  .app{
    width:100%; max-width:420px; height:100vh; height:100dvh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .app::after{
    content:''; position:absolute; inset:0; pointer-events:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.04); border-radius:0;
  }
  header{
    padding:14px 18px 10px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand h1{font-size:15px; font-weight:600; margin:0; letter-spacing:0.5px;}
  .brand span{font-size:10px; color:var(--dim); letter-spacing:1.5px; font-family:var(--mono);}
  .streak{
    display:flex; align-items:center; gap:5px; font-size:11px; color:var(--gold);
    background:rgba(210,153,34,0.1); border:1px solid rgba(210,153,34,0.25);
    padding:4px 9px; border-radius:20px;
  }
  main{flex:1; overflow-y:auto; overflow-x:hidden; padding:14px 18px 20px; -webkit-overflow-scrolling:touch;}
  main::-webkit-scrollbar{width:0;}
  nav{
    flex-shrink:0; display:flex; border-top:1px solid var(--border);
    background:var(--surface); padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; color:var(--dim); font-size:10px;
    padding:9px 0 11px; font-family:inherit; cursor:pointer; display:flex;
    flex-direction:column; align-items:center; gap:3px; transition:color .15s; letter-spacing:.2px;
  }
  nav button.on{color:var(--text);}
  nav button .ic{width:18px; height:18px; stroke:currentColor; stroke-width:1.6; fill:none;}

  /* ===== 交易日选择条：每个页面顶部都有，切了日期所有页面一起走 ===== */
  .datebar{display:flex; align-items:center; gap:7px; margin-bottom:11px;}
  .datebar .db-l{font-size:10px; letter-spacing:.4px; color:var(--dim);}
  .datebar input[type=date]{
    font-family:inherit; font-size:12px; color:var(--text); font-variant-numeric:tabular-nums;
    background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:5px 8px; color-scheme:dark; outline:none;
  }
  .datebar input[type=date]::-webkit-calendar-picker-indicator{opacity:.5; cursor:pointer;}
  .datebar.off input[type=date]{border-color:rgba(210,153,34,.5); color:var(--gold);}
  .datebar .db-today{
    margin-left:auto; font-size:10.5px; font-family:inherit; cursor:pointer;
    color:var(--gold); background:none; border:none; padding:4px 2px;
  }
  .datebar .db-flag{font-size:9.5px; color:var(--dim); margin-left:auto;}

  .quote-label{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px;}
  .quote-main{display:flex; align-items:flex-end; gap:14px; margin-top:4px;}
  .quote-price{font-size:40px; font-weight:600; line-height:1; letter-spacing:-1px; font-variant-numeric:tabular-nums;}
  .quote-price small{font-size:14px; font-weight:400; color:var(--muted); letter-spacing:0; margin-left:4px;}
  .quote-chg{font-size:15px; font-variant-numeric:tabular-nums; padding-bottom:3px;}
  .quote-sub{display:flex; gap:14px; margin-top:8px; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .up{color:var(--up);} .down{color:var(--down);} .flat{color:var(--muted);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-top:12px;}
  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .card-title{font-size:13px; font-weight:500;}
  .card-note{font-size:11px; color:var(--dim);}

  .bar{height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; margin-top:12px;}
  .bar > i{display:block; height:100%; border-radius:3px; transition:width .4s ease;}
  .bar-legend{display:flex; justify-content:space-between; font-size:10px; color:var(--dim); margin-top:6px;}

  .pos-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border-radius:10px; overflow:hidden;}
  .pos-cell{background:var(--surface); padding:10px 12px;}
  .pos-cell b{display:block; font-size:17px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:2px;}
  .pos-cell span{font-size:10px; color:var(--muted);}

  /* ===== 首页第一屏：今日大盘 · 挤压方块 =====
     整张卡就是一块画布：上红（摄入）下绿（消耗），两区高度比 = 两边热量比，
     块与块之间只留 2.2px 缝。占比越大颜色越沉，视觉上就是"重的把轻的挤扁"。 */
  .bd-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:15px 13px 12px; position:relative; overflow:hidden;
  }
  .bd-card::before{
    content:''; position:absolute; top:-60px; right:-40px; width:180px; height:180px;
    background:radial-gradient(circle, rgba(210,153,34,.09), transparent 68%); pointer-events:none;
  }
  .bd-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; position:relative;}
  .bd-sym{font-size:9.5px; letter-spacing:1.7px; color:var(--dim); font-family:var(--mono);}
  .bd-date{font-size:13.5px; color:var(--text); margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:.2px;}
  .bd-sk{font-size:12px; color:var(--gold); font-weight:500; text-align:right;}
  .bd-sk2{font-size:9.5px; color:var(--dim); margin-top:4px; text-align:right;}

  .bd-gap{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin:15px 0 0; padding-bottom:13px; border-bottom:1px solid #1A212A;
  }
  .bd-gap-l > span{font-size:10px; color:var(--dim); letter-spacing:.3px;}
  .bd-gap-n{
    font-size:31px; font-weight:600; line-height:1; letter-spacing:-1.2px; margin-top:7px;
    font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:1px;
  }
  .bd-gap-n i{font-size:11px; font-weight:400; font-style:normal; color:var(--muted); margin-left:5px; letter-spacing:0;}
  .bd-gap-r{text-align:right;}
  .bd-gap-r > span{font-size:10px; color:var(--dim); display:block;}
  .bd-gap-r b{font-size:14.5px; font-weight:500; display:block; margin-top:7px; font-variant-numeric:tabular-nums;}
  .bd-pill{
    display:inline-block; margin-top:8px; font-size:10px; padding:3px 9px; border-radius:20px;
    font-variant-numeric:tabular-nums; letter-spacing:.2px;
  }
  .bd-pill.ok{background:rgba(229,72,77,.14); color:var(--down);}
  .bd-pill.bad{background:rgba(61,214,140,.14); color:var(--up);}

  .bd-tabs{display:flex; gap:2px; background:var(--surface2); border-radius:9px; padding:3px; margin:13px 0 11px;}
  .bd-tab{
    flex:1; border:none; background:none; font-family:inherit; font-size:12px; color:var(--muted);
    padding:7px 0; border-radius:7px; cursor:pointer; transition:background .15s, color .15s;
  }
  .bd-tab.on{background:#E9EEF4; color:#0B0E11; font-weight:600;}

  .bd-canvas{border-radius:11px; overflow:hidden; background:#080B0E; line-height:0;}
  .bd-canvas svg{display:block; width:100%;}
  .bd-legend{display:flex; align-items:center; gap:5px; margin-top:10px; font-size:9.5px; color:var(--dim);}
  .bd-legend i{width:7px; height:7px; border-radius:2px; display:inline-block; margin-right:4px; vertical-align:middle;}
  .bd-legend .sp{margin-left:auto; font-size:9px; color:#3E4750;}
  .bd-jump{
    display:inline-flex; align-items:center; font-family:inherit; font-size:9.5px;
    background:#141A21; border:1px solid #252E38; color:#A8B3BF; border-radius:7px;
    padding:4px 8px; cursor:pointer; margin-right:4px;
  }
  .bd-jump:active{transform:scale(.96);}
  .bd-jump i{width:7px; height:7px; border-radius:2px; display:inline-block; margin-right:5px;}
  .bd-jump.buy{color:#6FDCA8; border-color:rgba(61,214,140,.34);}
  .bd-jump.sell{color:#F29296; border-color:rgba(229,72,77,.34);}
  .bd-tip{font-size:9.5px; color:#4C5560; margin-top:7px; line-height:1.5;}
  .bd-blk{cursor:pointer;}
  .bd-blk:active rect{opacity:.86;}
  .jumpboard{color:var(--gold); font-weight:500; cursor:pointer;}
  /* 位置落定之后再淡入文字，避免跟着色块一起飞 */
  .bd-anim text{animation:bdfade .34s .2s both;}
  @keyframes bdfade{from{opacity:0;} to{opacity:1;}}
  /* 刚记的那一笔：先亮一下再回到常态，眼睛能跟上是哪块变了 */
  .bd-flash rect{animation:bdflash .7s ease-out;}
  @keyframes bdflash{0%{filter:brightness(1.7);} 100%{filter:brightness(1);}}

  /* ===== 卖出页：运动录入表单 ===== */
  .ex-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .ex-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .ex-f{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .ex-f > span{font-size:9.5px; color:var(--dim); letter-spacing:0.3px;}
  .ex-f input{
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-size:12.5px; padding:8px 9px; font-family:inherit; outline:none;
    font-variant-numeric:tabular-nums;
  }
  .ex-f input:focus{border-color:rgba(210,153,34,.5);}
  .ex-quick{display:flex; gap:6px; margin-top:9px;}
  .ex-quick .chip{flex:1; padding:7px 0; text-align:center; font-size:11px;}
  .ex-acts{display:flex; gap:8px; margin-top:11px;}
  /* 记入卖盘：跟随「卖出 = 红」，与大盘卖盘同色 */
  .ex-btn{
    flex:1; padding:10px; border-radius:9px; font-size:12.5px; font-family:inherit; cursor:pointer;
    border:1px solid rgba(229,72,77,.34); background:rgba(229,72,77,.13); color:var(--down);
  }
  .ex-btn.ghost{flex:0 0 auto; padding:10px 15px; border-color:var(--border); background:var(--surface2); color:var(--muted);}
  .ex-hint{font-size:10px; color:var(--dim); line-height:1.65; margin-top:9px;}
  .ex-hint b{color:var(--muted); font-weight:500;}
  .log-row.tap{cursor:pointer;}
  .log-row.tap:active{background:rgba(255,255,255,.03);}
  .log-sub{font-size:9.5px; color:var(--dim); margin-left:6px; font-variant-numeric:tabular-nums;}
  .log-editing{background:rgba(210,153,34,.07);}

  .shop{display:flex; gap:12px; padding:13px 0; border-bottom:1px solid var(--border);}
  .shop:last-child{border-bottom:none; padding-bottom:2px;}
  .shop-body{flex:1; min-width:0;}
  .shop-top{display:flex; align-items:baseline; gap:6px;}
  .shop-name{font-size:13px; font-weight:500;}
  .shop-dist{font-size:10px; color:var(--dim);}
  .shop-dish{font-size:11px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .shop-meta{font-size:10px; color:var(--dim); margin-top:4px; font-variant-numeric:tabular-nums;}
  .shop-side{text-align:right; flex-shrink:0; width:82px;}
  .eff{font-size:18px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1;}
  .eff-unit{font-size:9px; color:var(--dim); margin-top:2px;}
  .btn-short{
    margin-top:7px; width:100%; padding:5px 0; font-size:11px; font-family:inherit;
    background:rgba(229,72,77,0.12); color:var(--down); border:1px solid rgba(229,72,77,0.3);
    border-radius:7px; cursor:pointer;
  }
  .btn-short:active{background:rgba(229,72,77,0.22);}
  .btn-long{
    margin-top:7px; width:100%; padding:5px 0; font-size:11px; font-family:inherit;
    background:rgba(61,214,140,0.1); color:var(--up); border:1px solid rgba(61,214,140,0.28);
    border-radius:7px; cursor:pointer;
  }
  .chips{display:flex; gap:8px; margin-bottom:6px; overflow-x:auto; padding-bottom:2px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; padding:5px 12px; font-size:11px; border-radius:20px; cursor:pointer;
    background:var(--surface); border:1px solid var(--border); color:var(--muted); font-family:inherit;
  }
  .chip.on{background:var(--text); color:var(--bg); border-color:var(--text);}

  .log-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .log-row:last-child{border-bottom:none;}
  .log-dot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .log-name{flex:1; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .log-kcal{font-size:12px; font-variant-numeric:tabular-nums; width:52px; text-align:right;}
  .log-del{background:none; border:none; color:var(--dim); font-size:14px; cursor:pointer; padding:0 0 0 6px; font-family:inherit;}
  .empty{font-size:12px; color:var(--dim); text-align:center; padding:22px 0;}

  .totals{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .total-box{background:var(--surface2); border-radius:10px; padding:11px 13px;}
  .total-box span{font-size:10px; color:var(--muted);}
  .total-box b{display:block; font-size:22px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:3px;}

  .foot-note{font-size:10px; color:var(--dim); line-height:1.7; margin-top:14px;}
  .toast{
    position:absolute; left:50%; bottom:78px; transform:translateX(-50%) translateY(10px);
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    font-size:12px; padding:9px 16px; border-radius:20px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; white-space:nowrap; z-index:20;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .mask{position:absolute; inset:0; background:rgba(0,0,0,.62); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30;}
  .mask.on{opacity:1; pointer-events:auto;}
  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:31; background:var(--surface);
    border-top:1px solid var(--border); border-radius:18px 18px 0 0;
    padding:10px 18px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(103%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:90%; overflow-y:auto;
  }
  .sheet.on{transform:translateY(0);}
  .sheet::-webkit-scrollbar{width:0;}
  .sheet-handle{width:36px; height:4px; border-radius:2px; background:var(--border); margin:0 auto 13px;}
  .sheet h3{font-size:14px; font-weight:600; margin:0 0 15px; display:flex; justify-content:space-between; align-items:baseline;}
  .sheet h3 em{font-style:normal; font-size:10px; color:var(--dim); font-weight:400;}
  .field{margin-bottom:11px;}
  .field label{display:block; font-size:10px; color:var(--muted); margin-bottom:5px;}
  .field input,.field select{
    width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    font-size:14px; font-family:inherit; padding:9px 11px; border-radius:9px; outline:none;
    font-variant-numeric:tabular-nums;
  }
  .field input::placeholder{color:#4C5560;}
  .field input:focus,.field select:focus{border-color:#3A4553;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sug{display:flex; flex-wrap:wrap; gap:6px; margin:-3px 0 11px;}
  .sug button{
    background:var(--surface2); border:1px solid var(--border); color:var(--muted);
    font-size:11px; font-family:inherit; padding:5px 10px; border-radius:7px; cursor:pointer;
  }
  .sug button:active{background:#232C36;}
  .sug button.net{color:var(--gold); border-color:rgba(210,153,34,.3);}
  .preview{
    background:rgba(61,214,140,.06); border:1px solid rgba(61,214,140,.18); border-radius:9px;
    padding:9px 12px; margin-bottom:11px; display:flex; align-items:baseline; justify-content:space-between;
  }
  .preview b{font-size:20px; font-weight:600; font-variant-numeric:tabular-nums;}
  .preview span{font-size:10px; color:var(--muted);}
  .btns{display:flex; gap:10px; margin-top:14px;}
  .btns button{
    flex:1; padding:12px 0; border-radius:10px; font-family:inherit; font-size:13px;
    cursor:pointer; border:1px solid var(--border); background:var(--surface2); color:var(--text);
  }
  .btns .primary{background:var(--text); color:var(--bg); border-color:var(--text); font-weight:500;}
  .btns .danger{flex:0 0 84px; color:var(--danger); border-color:rgba(229,72,77,.3); background:rgba(229,72,77,.07);}
  .add-bar{
    display:flex; align-items:center; justify-content:center; gap:6px; margin-top:12px; padding:12px;
    border:1px dashed var(--border); border-radius:12px; color:var(--muted); font-size:12px;
    cursor:pointer; background:transparent; font-family:inherit; width:100%;
  }
  .add-bar:active{background:var(--surface);}
  .edit-hint{font-size:10px; color:var(--dim); margin-top:2px;}

  /* ---------- 行情报价牌 ---------- */
  .ticker{
    position:relative; overflow:hidden; border-radius:18px; padding:15px 16px 13px;
    background:linear-gradient(158deg,#1B2430 0%,#141A22 58%,#10151B 100%);
    border:1px solid #27313C;
    box-shadow:0 12px 28px -20px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.045);
  }
  .tk-halo{position:absolute; width:230px; height:230px; right:-80px; top:-128px; border-radius:50%; pointer-events:none;}
  .tk-head{display:flex; align-items:flex-start; justify-content:space-between; position:relative;}
  .tk-sym{font-size:11px; letter-spacing:1.4px; color:#AEB8C4; font-family:var(--mono); display:flex; align-items:center; gap:6px;}
  .tk-live{
    font-style:normal; font-size:8px; letter-spacing:1px; color:#3DD68C;
    background:rgba(61,214,140,.12); border:1px solid rgba(61,214,140,.25); border-radius:4px; padding:1px 4px;
  }
  .tk-live.arc{color:var(--gold); background:rgba(210,153,34,.12); border-color:rgba(210,153,34,.3);}
  .bd-arch{
    font-size:10.5px; line-height:1.6; color:var(--muted); margin-top:9px;
    padding:8px 10px; background:rgba(210,153,34,.07); border-left:2px solid rgba(210,153,34,.5); border-radius:6px;
  }
  .tk-sub{font-size:9.5px; color:#5C6672; margin-top:5px;}
  .tk-badge{
    font-size:11px; font-variant-numeric:tabular-nums; padding:3px 8px; border-radius:20px; flex-shrink:0;
  }
  .tk-badge.up{background:rgba(61,214,140,.12); border:1px solid rgba(61,214,140,.28);}
  .tk-badge.down{background:rgba(229,72,77,.12); border:1px solid rgba(229,72,77,.28);}
  .tk-price{
    font-size:44px; font-weight:600; line-height:1.05; letter-spacing:-1.6px;
    font-variant-numeric:tabular-nums; margin-top:12px; position:relative;
  }
  .tk-price small{font-size:13px; font-weight:400; color:#7D8794; letter-spacing:0; margin-left:5px;}
  .tk-change{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:12px; font-variant-numeric:tabular-nums;}
  .tk-pct{padding:1px 6px; border-radius:5px; font-size:11px;}
  .tk-pct.up{background:rgba(61,214,140,.13);}
  .tk-pct.down{background:rgba(229,72,77,.13);}
  .tk-vs{margin-left:auto; font-size:10px; color:#6B7583;}
  .tk-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:13px;
    background:#232C36; border-radius:9px; overflow:hidden;
  }
  .tk-grid > div{background:rgba(17,22,28,.72); padding:7px 9px;}
  .tk-grid span{font-size:9px; color:#6B7583; display:block;}
  .tk-grid b{font-size:12.5px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:2px; display:block;}

  /* ---------- K 线卡片 ---------- */
  .kcard{padding:12px 10px 10px;}
  .kcard-head{display:flex; align-items:center; justify-content:space-between; padding:0 4px 8px;}
  .pt-tabs{display:flex; gap:2px; background:#11161C; border:1px solid #232C36; border-radius:9px; padding:2px;}
  .pt{
    background:none; border:none; color:#7D8794; font-family:inherit; font-size:11px;
    padding:5px 11px; border-radius:7px; cursor:pointer; transition:background .15s,color .15s;
  }
  .pt.on{background:#E8EDF2; color:#0B0E11; font-weight:500;}
  .kcard-chg{font-size:12px; font-variant-numeric:tabular-nums; display:flex; align-items:baseline; gap:5px;}
  .kcard-chg em{font-style:normal; font-size:10px; opacity:.8;}
  .kstat{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; border-top:1px solid var(--border); margin-top:8px; padding-top:9px;}
  .kstat > div{text-align:center;}
  .kstat span{font-size:9px; color:#5C6672; display:block;}
  .kstat b{font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; margin-top:2px; display:block;}
  .khint{font-size:9px; color:#4C5560; text-align:center; margin-top:7px;}
  /* 根数档位：疏 / 中 / 密。放在图上方而不是右边 —— 图宽本来就紧 */
  .kzoom{display:flex; align-items:center; gap:4px; padding:0 4px 6px;}
  .kzoom .kz-l{font-size:9px; color:#4C5560; letter-spacing:.3px;}
  .kzoom button{
    font-family:inherit; font-size:9.5px; line-height:1; color:#7C8794; background:#11161C;
    border:1px solid #232C36; border-radius:6px; padding:4px 8px; cursor:pointer;
  }
  .kzoom button.on{color:#0B0E11; background:var(--gold); border-color:var(--gold); font-weight:600;}
  .kzoom em{font-style:normal; font-size:9px; color:#4C5560; margin-left:auto; font-variant-numeric:tabular-nums;}
  .k-wrap{position:relative; touch-action:pan-y; user-select:none; -webkit-user-select:none;}
  .k-tip{
    position:absolute; width:118px; padding:7px 9px; border-radius:9px; pointer-events:none;
    background:rgba(21,26,33,.97); border:1px solid #2E3946; opacity:0; transition:opacity .12s;
    box-shadow:0 8px 18px -10px rgba(0,0,0,.9);
  }
  .kt-date{font-size:8.5px; color:#7D8794; font-family:var(--mono);}
  .kt-price{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; margin:2px 0 4px; letter-spacing:-.3px;}
  .kt-price span{font-size:9px; font-weight:400; margin-left:4px; letter-spacing:0;}
  .kt-row{display:flex; justify-content:space-between; font-size:9px; color:#7D8794; line-height:1.7;}
  .kt-row b{color:#C6CFD9; font-weight:500; font-variant-numeric:tabular-nums;}
  .basis-note{font-size:10px; color:#7D8794; line-height:1.65; margin-top:9px; padding-top:9px; border-top:1px solid var(--border);}

  /* ---------- 复盘 ---------- */
  .rv-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
  .rv-range{font-size:10px; color:#5C6672; font-family:var(--mono);}
  .rv-hero{padding:14px;}
  .rv-hero-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .rv-hero-label{font-size:10px; color:var(--muted);}
  .rv-hero-num{font-size:34px; font-weight:600; line-height:1.1; font-variant-numeric:tabular-nums; letter-spacing:-1px; margin-top:3px;}
  .rv-hero-unit{font-size:9.5px; color:#5C6672; margin-top:3px;}
  .rv-hero-right{text-align:right;}
  .rv-kg{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;}
  .rv-kg small,.rv-kg2 small{font-size:9px; font-weight:400; color:#6B7583; margin-left:3px;}
  .rv-kg2{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:5px;}
  .dbars{position:relative; display:flex; align-items:stretch; gap:2px; height:58px; margin-top:12px;}
  .dbars::after{content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:#2B3441;}
  .dbar{flex:1; position:relative;}
  .dbar i{position:absolute; left:0; right:0; border-radius:2px;}
  /* 0 轴上方 = 赚（净缺口），下方 = 亏（净盈余）；红=赚、绿=亏 */
  .dbar i.gain{bottom:50%; background:var(--down); opacity:.88;}
  .dbar i.loss{top:50%; background:var(--up); opacity:.88;}

  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-w{font-size:9px; color:#4C5560; text-align:center; padding-bottom:1px;}
  .cal-cell{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:6px;
    font-size:9px; font-style:normal; background:#171D25; color:#5C6672; font-variant-numeric:tabular-nums;
  }
  .cal-cell.blank{background:transparent;}
  .cal-cell.ok{background:rgba(229,72,77,.22); color:#E5484D; border:1px solid rgba(229,72,77,.34);}
  .cal-cell.half{background:rgba(139,148,158,.1); color:#8B949E; border:1px solid rgba(139,148,158,.18);}
  .cal-cell.long{background:rgba(61,214,140,.2); color:#3DD68C; border:1px solid rgba(61,214,140,.36);}
  .cal-legend{display:flex; gap:12px; margin-top:11px; font-size:9px; color:#6B7583;}
  .cal-legend span{display:flex; align-items:center; gap:4px;}
  .dot{width:7px; height:7px; border-radius:2px; display:inline-block;}
  .dot.ok{background:rgba(229,72,77,.55);}
  .dot.half{background:rgba(139,148,158,.4);}
  .dot.long{background:rgba(61,214,140,.55);}

  .src-row{padding:9px 0; border-bottom:1px solid var(--border);}
  .src-row:last-child{border-bottom:none; padding-bottom:2px;}
  .src-name{font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .src-tags{display:flex; gap:6px; margin-top:5px; flex-wrap:wrap;}
  .st{font-size:9px; padding:2px 6px; border-radius:5px; font-variant-numeric:tabular-nums;}
  .st.p{background:rgba(91,155,213,.12); color:#7FB3E0;}
  .st.f{background:rgba(210,153,34,.12); color:#C9962E;}
  .st.fb{background:rgba(61,214,140,.1); color:#4FC98D;}
  .st.zero{background:rgba(139,148,158,.1); color:#6B7583;}

  .cmp-row{display:grid; grid-template-columns:1fr auto 62px; align-items:baseline; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);}
  .cmp-row:last-of-type{border-bottom:none;}
  .cmp-name{font-size:12px; color:#AEB8C4;}
  .cmp-val{font-size:13px; font-variant-numeric:tabular-nums;}
  .cmp-val em{font-style:normal; font-size:9px; color:#5C6672; margin-left:2px;}
  .cmp-diff{font-size:11px; text-align:right; font-variant-numeric:tabular-nums;}
  .cmp-note{font-size:9px; color:#4C5560; margin-top:9px; line-height:1.6;}

  .contrib-row{display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--border);}
  .contrib-row:last-child{border-bottom:none; padding-bottom:2px;}
  .tag{
    flex-shrink:0; width:22px; height:22px; border-radius:6px; font-size:10px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .tag.down{background:rgba(229,72,77,.13); color:var(--down); border:1px solid rgba(229,72,77,.26);}
  .tag.up{background:rgba(61,214,140,.11); color:var(--up); border:1px solid rgba(61,214,140,.24);}
  .tag.gold{background:rgba(210,153,34,.12); color:var(--gold); border:1px solid rgba(210,153,34,.26);}
  .contrib-t{font-size:12px;}
  .contrib-d{font-size:10px; color:#6B7583; margin-top:3px; font-variant-numeric:tabular-nums; line-height:1.5;}

  .summary p{font-size:12.5px; line-height:1.85; color:#C6CFD9; margin:0 0 9px;}
  .summary p:last-child{margin-bottom:0;}

  /* ---------- 成分表拍照 ---------- */
  .scan-box{border:1px solid var(--border); background:#111721; border-radius:11px; padding:10px 11px; margin:-2px 0 12px;}
  .scan-guide{display:flex; gap:9px; align-items:flex-start;}
  .scan-ico{width:26px; height:26px; flex-shrink:0; color:#5B9BD5; opacity:.85; margin-top:1px;}
  .scan-t{font-size:11.5px; color:#D6DEE7; font-weight:500;}
  .scan-d{font-size:9.5px; color:#6B7583; line-height:1.6; margin-top:3px;}
  .scan-actions{display:flex; align-items:center; gap:9px; margin-top:9px;}
  .scan-btn{
    flex:1; padding:8px 0; font-size:11.5px; font-family:inherit; cursor:pointer;
    border-radius:8px; border:1px solid rgba(91,155,213,.32); background:rgba(91,155,213,.1); color:#8FBEE8;
  }
  .scan-btn:active{background:rgba(91,155,213,.2);}
  #scan-thumb{display:none; width:34px; height:34px; object-fit:cover; border-radius:6px; border:1px solid var(--border);}
  .scan-status{font-size:9.5px; color:#6B7583; line-height:1.5; margin-top:7px;}

  /* ---------- 设置页 ---------- */
  .seg{display:flex; gap:6px; background:var(--surface2); padding:3px; border-radius:9px; border:1px solid var(--border);}
  .seg button{
    flex:1; padding:7px 0; font-size:11.5px; font-family:inherit; cursor:pointer; border:none;
    border-radius:7px; background:none; color:var(--muted); transition:all .15s;
  }
  .seg button.on{background:#2B3642; color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.25);}
  .set-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid #1A212A;}
  .set-row:last-child{border-bottom:none;}
  .set-label{font-size:12.5px; color:var(--text);}
  .set-sub{font-size:9.5px; color:var(--dim); margin-top:3px; line-height:1.5; max-width:190px;}
  .set-input{
    width:92px; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    font-size:14px; font-family:inherit; padding:7px 10px; border-radius:8px; outline:none;
    text-align:right; font-variant-numeric:tabular-nums;
  }
  .set-input:focus{border-color:#3A4553;}
  .set-input.off{opacity:.4;}
  .unit-r{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--dim);}
  .act-grid{display:flex; flex-direction:column; gap:6px; margin-top:4px;}
  .act-opt{
    display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:9px; cursor:pointer;
    border:1px solid var(--border); background:var(--surface2); transition:all .15s;
  }
  .act-opt.on{border-color:rgba(210,153,34,.45); background:rgba(210,153,34,.08);}
  .act-k{font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; color:var(--gold); min-width:34px;}
  .act-t{font-size:11.5px; color:var(--text);}
  .act-d{font-size:9.5px; color:var(--dim); margin-top:2px;}

  /* 热量预算：两根同刻度的条 + 预算刻度线 */
  .bud-two{display:grid; grid-template-columns:30px 1fr; gap:6px 8px; align-items:center;}
  .bud-tag{font-size:9.5px; color:var(--dim); letter-spacing:.5px;}
  .bud-line{position:relative; height:13px; border-radius:4px; background:#1A212A; display:flex; overflow:hidden;}
  .bud-line i{display:block; height:100%; transition:width .3s;}
  .bud-mark{position:absolute; top:0; bottom:0; width:1.5px; background:#E8EDF2; z-index:2; box-shadow:0 0 4px rgba(232,237,242,.55);}
  .bud-scale{display:flex; justify-content:space-between; font-size:8.5px; color:#4C5560; margin-top:6px; padding-left:38px; font-variant-numeric:tabular-nums;}
  .bud-legend{display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:10px; font-size:10px; color:var(--muted);}
  .bud-legend span{display:flex; align-items:center; gap:5px; font-variant-numeric:tabular-nums;}
  .bud-legend b{color:var(--text); font-weight:500;}
  .surplus-num{font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.05;}
  .surplus-row{display:flex; align-items:baseline; gap:12px; margin:2px 0 12px;}

  /* 体重波动曲线 */
  .vol-wrap{margin-top:6px;}
  .vol-tabs{display:flex; gap:5px;}
  .vol-tabs button{
    padding:4px 9px; font-size:10.5px; font-family:inherit; cursor:pointer; border-radius:6px;
    border:1px solid var(--border); background:none; color:var(--dim);
  }
  .vol-tabs button.on{background:#2B3642; color:var(--text); border-color:#38444F;}
  .vol-legend{display:flex; flex-wrap:wrap; gap:11px; margin-top:9px; font-size:9.5px; color:var(--dim);}
  .vol-legend span{display:flex; align-items:center; gap:5px;}
  .vol-line{width:14px; height:0; border-top-width:2px; border-top-style:solid; display:inline-block;}
  .vol-band{width:14px; height:8px; border-radius:2px; display:inline-block;}
  .vol-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#1A212A; border-radius:9px; overflow:hidden; margin-top:11px;}
  .vol-cell{background:var(--surface); padding:9px 11px;}
  .vol-cell span{font-size:9.5px; color:var(--dim); display:block;}
  .vol-cell b{font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; display:block; margin-top:3px;}
  .vol-cell em{font-style:normal; font-size:9.5px; color:var(--dim); margin-left:3px;}
  .vol-note{font-size:10px; line-height:1.75; color:#7B8592; margin-top:11px; padding-top:10px; border-top:1px solid #1A212A;}

  /* ---------- 数据 / 备份 ---------- */
  .dp-grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#1A212A; border-radius:9px; overflow:hidden;}
  .dp-cell{background:var(--surface); padding:9px 11px;}
  .dp-cell span{font-size:9.5px; color:var(--dim); display:block;}
  .dp-cell b{font-size:14px; font-weight:500; font-variant-numeric:tabular-nums; display:block; margin-top:3px;}
  .dp-cell em{font-style:normal; font-size:9.5px; color:var(--dim); margin-left:3px;}
  .dp-acts{display:flex; flex-direction:column; gap:8px;}
  .dp-btn{
    display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;
    padding:11px 13px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
    color:var(--text); font-size:12.5px; font-family:inherit; text-align:left; cursor:pointer;
    transition:transform .12s, border-color .15s;
  }
  .dp-btn:active{transform:scale(.99);}
  .dp-btn small{display:block; font-size:9.5px; color:var(--dim); margin-top:3px; font-weight:400; line-height:1.4;}
  .dp-btn i{font-style:normal; font-size:13px; color:var(--dim); flex-shrink:0;}
  .dp-btn.primary{border-color:rgba(210,153,34,.42); background:rgba(210,153,34,.09);}
  .dp-btn.primary .dp-k{color:var(--gold);}
  .dp-btn.primary i{color:var(--gold);}
  .dp-btn.danger{border-color:rgba(229,72,77,.28); background:rgba(229,72,77,.06); color:#F0807F;}
  .dp-k{font-size:12.5px; font-weight:500;}
  .dp-det summary{
    display:flex; align-items:center; justify-content:space-between; list-style:none; cursor:pointer;
    padding:11px 13px; border-radius:10px; border:1px solid var(--border); background:var(--surface2);
    font-size:12.5px; color:var(--text);
  }
  .dp-det summary::-webkit-details-marker{display:none;}
  .dp-det summary::after{content:'展开'; font-size:9.5px; color:var(--dim);}
  .dp-det[open] summary::after{content:'收起';}
  .dp-det[open] summary{border-bottom-left-radius:0; border-bottom-right-radius:0;}
  .dp-code{
    width:100%; height:74px; padding:9px 10px; resize:vertical; outline:none;
    background:#0F1419; border:1px solid var(--border); border-top:none;
    border-bottom-left-radius:10px; border-bottom-right-radius:10px;
    color:var(--muted); font-family:var(--mono); font-size:9.5px; line-height:1.55;
  }
  .dp-det .dp-btn{margin-top:8px;}
  .dp-snap{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid #1A212A;}
  .dp-snap:last-of-type{border-bottom:none;}
  .dp-snap .t{font-size:11.5px;}
  .dp-snap .d{font-size:9.5px; color:var(--dim); margin-top:3px; font-variant-numeric:tabular-nums;}
  .dp-snap button{
    padding:5px 11px; font-size:10.5px; font-family:inherit; cursor:pointer; border-radius:7px; flex-shrink:0;
    border:1px solid var(--border); background:none; color:var(--muted);
  }
  .dp-snap button:active{border-color:var(--gold); color:var(--gold);}
  .dp-warn{font-size:10px; color:#D29922; line-height:1.6; margin-top:10px;}
  .dp-empty{font-size:10.5px; color:var(--dim); padding:16px 0; text-align:center;}
  .dp-link{color:var(--gold); cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>卡路里交易所</h1>
      <span>CAL·EX</span>
    </div>
    <div class="streak" id="streak">连续做空 6 天</div>
  </header>
  <main id="main">
    <div class="datebar" id="datebar"></div>
    <div id="view"></div>
  </main>
  <nav>
    <button data-view="market" class="on">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 4"/></svg>
      行情
    </button>
    <button data-view="nearby">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 4.6h2.3l2.1 9.7h9.5l1.9-6.7H6.5"/><circle cx="9.6" cy="18.6" r="1.35"/><circle cx="16" cy="18.6" r="1.35"/></svg>
      买入
    </button>
    <button data-view="log">
      <svg class="ic" viewBox="0 0 24 24"><path d="M12.2 20.6a5.6 5.6 0 01-5.6-5.6c0-3.2 2.4-6 3.8-7.6.4 1.8 1.2 2.6 2.1 2.6 1 0 1.6-1 1.3-3.8 2.2 1.9 4.1 5 4.1 8.2a5.6 5.6 0 01-5.7 6.2z"/></svg>
      卖出
    </button>
    <button data-view="review">
      <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="4.4" width="14" height="15.2" rx="2.2"/><path d="M9 9.2h6M9 12.6h6M9 16h3.4"/></svg>
      复盘
    </button>
    <button data-view="profile">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/></svg>
      我的
    </button>
  </nav>
  <div class="toast" id="toast"></div>

  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-handle"></div>
    <h3><span id="s-title">添加标的</span><em>热量 = 每 100g 热量 × 克重 ÷ 100</em></h3>

    <div class="field">
      <label>食物名称</label>
      <input id="f-food" placeholder="如：红烧肉、鸡胸沙拉" autocomplete="off">
    </div>
    <div class="sug" id="sug"></div>

    <div class="scan-box">
      <div class="scan-guide">
        <svg class="scan-ico" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="6" y="5" width="28" height="30" rx="3"/>
          <path d="M11 12h18M11 17h18M11 22h18M11 27h11"/>
          <path d="M31 30l4 4M35 30l-4 4" stroke-width="1.4"/>
        </svg>
        <div>
          <div class="scan-t">只拍背面的营养成分表</div>
          <div class="scan-d">对准白底黑字那张表，让它占满画面、四边对齐。不要拍正面 logo、配料表或条形码。</div>
        </div>
      </div>
      <div class="scan-actions">
        <button id="btn-scan" class="scan-btn">打开相机 · 拍成分表</button>
        <img id="scan-thumb" alt="">
      </div>
      <div id="scan-status" class="scan-status"></div>
    </div>
    <input type="file" id="file-cam" accept="image/*" capture="environment" style="display:none">

    <div class="row2">
      <div class="field">
        <label>克重 (g)</label>
        <input id="f-grams" type="number" inputmode="decimal" placeholder="200">
      </div>
      <div class="field">
        <label>每 100g 热量 (kcal)</label>
        <input id="f-per100" type="number" inputmode="decimal" placeholder="470">
      </div>

function learnFood(name, per100, nutri) {
  if (!name || !(per100 > 0)) return;
  const key = name.trim();
  const n = nutri || {};
  const rec = { n: key, k: per100 };
  ['p', 'f', 'c', 'fb'].forEach((k) => {
    if (n[k] != null && n[k] !== '') rec[k] = Number(n[k]);
  });
  const hit = userFoods.find((f) => f.n === key);
  if (hit) {
    Object.assign(hit, rec);
  } else {
    userFoods.unshift(rec);
    if (userFoods.length > 300) userFoods.pop();
  }
  saveUserFoods();
}

  } catch (e) {

}
