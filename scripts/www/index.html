}

/* 「数据」分段：本机家底 + 备份 / 恢复 / 快照。
   这一页平时不用看，只在换手机、丢了手机、或者手滑删错东西时才进来，
   所以每个按钮下面都写清"会发生什么"，不靠用户猜。 */
function dataPanel() {
  const data = collectData();
  const st = dataStats(data);
  const meta = metaInfo();
  const idx = snapIndex();
  const bytes = payloadBytes(data);
  const days = meta.lastBackupAt ? Math.floor((Date.now() - meta.lastBackupAt) / 86400000) : -1;
  const stale = days < 0 || days > 7;
  const rangeTxt = st.first ? `${st.first} ~ ${(st.last || st.first).slice(5)}` : '还没有记录';

  const snaps = idx.length
    ? idx.map((s) => {
        const x = s.stats || {};
        return `<div class="dp-snap">
          <div>
            <div class="t">${ago(s.at)} · ${esc(String(s.reason || '自动'))}</div>
            <div class="d">${x.days || 0} 天 · ${x.items || 0} 笔 · 盘口 ${x.shops || 0}</div>
          </div>
          <button data-dp="snap" data-id="${esc(String(s.id))}">回滚</button>

      }).join('')
    : '<div class="dp-empty">还没有快照 · 记完第一笔会自动生成</div>';

  return `
    <div class="card">
      <div class="card-head">
        <span class="card-title">本机数据</span>
        <span class="card-note dp-link" id="dp-persist" data-dp="persist">检测中…</span>
      </div>
      <div class="dp-grid">
        <div class="dp-cell"><span>逐日记录</span><b>${st.days} 天<em>${st.items} 笔</em></b></div>
        <div class="dp-cell"><span>数据跨度</span><b style="font-size:11.5px">${rangeTxt}</b></div>
        <div class="dp-cell"><span>自选盘口</span><b>${st.shops}<em>个</em></b></div>
        <div class="dp-cell"><span>我的食物</span><b>${st.foods}<em>条</em></b></div>
        <div class="dp-cell"><span>占用空间</span><b>${fmtBytes(bytes)}</b></div>
        <div class="dp-cell"><span>上次备份</span><b style="font-size:11.5px;color:${stale ? 'var(--gold)' : 'var(--text)'}">${meta.lastBackupAt ? ago(meta.lastBackupAt) : '从未备份'}</b></div>
      </div>
      <div class="vol-note" style="border-top:none;padding-top:10px">
        这些数据只存在这台手机里，没有服务器、不联网上传。
        浏览器在清缓存、或者长期不打开时可能把它回收，所以备份值得花一分钟做一次。
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">备份</span>
        <span class="card-note">${meta.backupCount ? '已备份 ' + meta.backupCount + ' 次' : '还没备份过'}</span>
      </div>
      <div class="dp-acts">
        <button class="dp-btn primary" data-dp="export">
          <span><span class="dp-k">导出备份文件</span><small>存成 .json，放进手机「文件」或发给自己</small></span><i>›</i>
        </button>
        <button class="dp-btn" data-dp="copy">
          <span><span class="dp-k">复制备份码</span><small>一段文本，粘到备忘录、微信收藏或邮件</small></span><i>›</i>
        </button>
        <button class="dp-btn" data-dp="share">
          <span><span class="dp-k">系统分享</span><small>直接发微信 / 存云盘（手机支持时）</small></span><i>›</i>
        </button>
      </div>
      ${stale ? `<div class="dp-warn">${days < 0 ? '还没有备份过' : days + ' 天没备份了'}。换手机、丢手机、清缓存都会丢数据，建议现在就做一次。</div>` : ''}
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title">恢复</span><span class="card-note">会让你选覆盖还是合并</span></div>
      <div class="dp-acts">
        <button class="dp-btn" data-dp="import">
          <span><span class="dp-k">从备份文件恢复</span><small>选一个之前导出的 .json</small></span><i>›</i>
        </button>
      </div>
      <details class="dp-det" style="margin-top:8px">

        <button class="dp-btn" data-dp="do-paste">

      <div class="vol-note">

        <b>合并</b>：已经在新手机上记了几天，想保住这几天的记录 —— 流水按日期和 id 去重取并集，设置保留本机的。

    <div class="card">

      数据不上云是刻意的：体重和饮食记录只值得你自己看。
    </div>`;
}

    <div class="card">

/* ================= 营养分段（挂在「我的」页里） ================= */
const NUTRI_META = [
  { key: 'p', label: '蛋白质', color: '#5B9BD5' },
  { key: 'f', label: '脂肪', color: '#D29922' },
  { key: 'c', label: '碳水', color: '#9B7EDE' },
  { key: 'fb', label: '膳食纤维', color: '#3DD68C' }
];

function nutriPanel() {
  const t = nutritionTargets();
  const g = dayNutrients();
  const ratio = t.kcal > 0 ? g.kcal / t.kcal : 0;
  const C = 2 * Math.PI * 76;
  const dash = Math.min(ratio, 1) * C;
  const over = g.kcal > t.kcal;
  const ringColor = over ? '#3DD68C' : '#E5484D';

  const rows = NUTRI_META.map((m) => {
    const val = g[m.key];
    const target = t[m.key];
    const p = target > 0 ? Math.min(100, (val / target) * 100) : 0;
    const isOver = val > target * 1.05;
    const isDone = val >= target * 0.9;
    return { ...m, val, target, p, isOver, isDone };
  });

  const lacking = rows.filter((r) => r.val < r.target * 0.9);
  const exceeded = rows.filter((r) => r.isOver);

  return `
    <div class="edit-hint" style="margin-bottom:2px">
      预算 ${intakeBudget()} kcal · ${profile.mode === 'auto' ? '自动测算' : '手动指定'} · 达标线按目标的 90% 计
    </div>

    <div style="position:relative;width:176px;margin:10px auto 4px">
      <svg viewBox="0 0 180 180" width="176" style="display:block">
        <circle cx="90" cy="90" r="76" fill="none" stroke="#1C232B" stroke-width="11"/>
        <circle cx="90" cy="90" r="76" fill="none" stroke="${ringColor}" stroke-width="11"
          stroke-dasharray="${dash.toFixed(1)} ${C.toFixed(1)}" stroke-linecap="round"
          transform="rotate(-90 90 90)"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div style="font-size:29px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1">${Math.round(g.kcal)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">/ ${t.kcal} kcal</div>
      </div>
    </div>
    <div style="text-align:center;font-size:11px;color:${over ? 'var(--up)' : 'var(--muted)'};margin-bottom:4px">
      ${over ? `已超预算 ${Math.round(g.kcal - t.kcal)} kcal` : `预算还剩 ${Math.round(t.kcal - g.kcal)} kcal`}
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">营养素达标</span>
        <span class="card-note">${lacking.length ? lacking.length + ' 项未达标' : '全部达标'}</span>
      </div>
      ${rows.map((r) => `
        <div style="margin-bottom:13px">
          <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:5px">
            <span>${r.label}</span>
            <span style="font-variant-numeric:tabular-nums">
              <b style="font-size:14px;color:${r.isOver ? 'var(--up)' : 'var(--text)'}">${r.val.toFixed(1)}</b>
              <span style="color:var(--dim)">/ ${r.target} g</span>
            </span>
          </div>
          <div class="bar" style="margin-top:0">
            <i style="width:${r.p}%;background:${r.isOver ? '#3DD68C' : r.color}"></i>
          </div>
        </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">今日还缺什么</span>
        <span class="card-note">按 90% 达标线</span>
      </div>
      ${lacking.length === 0 && exceeded.length === 0
        ? '<div class="empty">四项都达标了，今天收工</div>'
        : [
            ...lacking.map((r) => `
              <div class="log-row">
                <span class="log-dot" style="background:${r.color}"></span>
                <span class="log-name">${r.label}还差</span>
                <span class="log-kcal" style="color:var(--muted)">${(r.target - r.val).toFixed(1)} g</span>
              </div>`),
            ...exceeded.map((r) => `
              <div class="log-row">
                <span class="log-dot" style="background:var(--up)"></span>
                <span class="log-name">${r.label}已超</span>
                <span class="log-kcal up">+${(r.val - r.target).toFixed(1)} g</span>
              </div>`)
          ].join('')}
    </div>

    <div class="card">
      <div class="card-head">
        <span class="card-title">每笔吃了什么</span>
        <span class="card-note">按蛋白质排序</span>
      </div>
      ${state.logs.filter((l) => l.type === 'food').length === 0
        ? '<div class="empty">今天还没有摄入记录</div>'
        : state.logs
            .filter((l) => l.type === 'food')
            .slice()
            .sort((a, b) => (b.p || 0) - (a.p || 0))
            .map((l) => {
              const tag = (v, cls, unit) =>
                v > 0 ? `<span class="st ${cls}">${unit} ${v.toFixed(1)}</span>` : `<span class="st zero">${unit} 0</span>`;
              return `
              <div class="src-row">
                <div class="src-name">${l.name} <span style="color:var(--dim);font-size:10px">${l.kcal} kcal</span></div>
                <div class="src-tags">
                  ${tag(Number(l.p) || 0, 'p', '蛋白')}
                  ${tag(Number(l.f) || 0, 'f', '脂肪')}
                  ${tag(Number(l.fb) || 0, 'fb', '纤维')}
                </div>
              </div>`;
            })
            .join('')}
    </div>

    <button class="add-bar" data-scan="1">拍包装背面的营养成分表</button>
    <div class="foot-note">
      只拍背面那张营养成分表，不拍正面包装。识别会读出「能量 / 蛋白质 / 脂肪 / 碳水 / 膳食纤维」并填进表单，核对后才保存。<br>
      自动过滤 NRV% 那一列，遇到「每份」标注会换算成每 100g。识别不保证准确，核对这一步不能省。
    </div>`;
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

/* 交易日选择条：每个页面顶部都有，日期一改，全站跟着走 */
function renderDatebar() {
  const bar = document.getElementById('datebar');
  if (!bar) return;
  const today = todayStr();
  const off = state.selDate !== today;
  bar.className = 'datebar' + (off ? ' off' : '');
  bar.innerHTML = `

function render(keepScroll) {
  const v = document.getElementById('view');
  const sc = document.getElementById('main');
  const keep = keepScroll && sc ? sc.scrollTop : 0;
  const map = {
    market: viewMarket, nearby: viewNearby, log: viewLog,
    review: viewReview, profile: viewProfile
  };
  renderDatebar();
  v.innerHTML = (map[state.view] || viewMarket)();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === state.view));
  const st = liveStreak();
  document.getElementById('streak').textContent = `连续做空 ${st} 天`;
  if (sc) sc.scrollTop = keep;
  bindKline();
  bindBoardAnim();
  /* 数据页的「长期保存」状态要异步问浏览器，渲染完再回填 */
  if (state.view === 'profile' && state.pfTab === 'data') probePersist();
}

document.body.addEventListener('click', (e) => {
  /* 表单里的按钮/输入框自己处理，别被下面的委托截走 */
  if (e.target.closest('#ex-save')) { saveEx(); return; }
  if (e.target.closest('#ex-cancel')) { cancelEx(); return; }

  const t = e.target.closest(
    '[data-view],[data-pftab],[data-cat],[data-eat],[data-del],[data-edit],[data-add],[data-scan],[data-period],[data-review],[data-vol],[data-mode],[data-sex],[data-act],[data-def],[data-ex],[data-exmin],[data-exedit],[data-board],[data-date],[data-kzoom],[data-dp]'
  );
  if (!t) return;

  /* 数据页的动作单独走一个入口，避免把备份/恢复的分支塞进这条主委托 */
  if (t.dataset.dp) { handleDataAction(t.dataset.dp, t); return; }

  /* 运动表单相关：全部走局部同步，不整页重绘（否则输入框和焦点会被冲掉） */
  if (t.dataset.ex != null) {
    pickEx(Number(t.dataset.ex));
    return;
  }
  if (t.dataset.exmin != null) {
    state.exDraft.mins = Number(t.dataset.exmin);
    state.exDraft.kcal = null;          // 换时长就回到公式值
    syncExDom();
    return;
  }
  if (t.dataset.exedit != null) {
    startEditEx(t.dataset.exedit);
    return;
  }

  if (t.dataset.view) {
    state.view = t.dataset.view;
    /* 首页「改设置 ›」这类入口直接落到对应分段 */
    if (t.dataset.pftab) state.pfTab = t.dataset.pftab;
    render();
    return;
  }
  if (t.dataset.pftab) {
    state.pfTab = t.dataset.pftab;
    render(true);
    return;
  }
  if (t.dataset.date) {
    switchDate(todayStr());
    return;
  }
  if (t.dataset.kzoom != null) {
    /* K 线密度：只换数据不换布局，滚动位置要留住 */
    state.kZoom = Number(t.dataset.kzoom);
    render(true);
    return;
  }
  if (t.dataset.vol) {
    state.volRange = Number(t.dataset.vol);
    render(true);
    return;
  }
  if (t.dataset.mode) {
    profile.mode = t.dataset.mode;
    saveProfile();
    render(true);
    toast(profile.mode === 'auto' ? '已切到自动测算' : '已切到手动指定');
    return;
  }
  if (t.dataset.sex) {
    profile.sex = t.dataset.sex;
    saveProfile();
    render(true);
    return;
  }
  if (t.dataset.act) {
    profile.activity = Number(t.dataset.act);
    saveProfile();
    render(true);
    return;
  }
  if (t.dataset.def) {
    profile.deficit = Number(t.dataset.def);
    saveProfile();
    render(true);
    return;
  }
  if (t.dataset.period) {
    /* 必须保持滚动位置：K 线卡高度固定，切周期只是换数据，
       一 render() 就回顶会让用户以为整个页面被重置了（"跳动"就是这么来的） */
    state.period = t.dataset.period;
    render(true);
    return;
  }
  if (t.dataset.board) {
    state.boardTab = t.dataset.board;
    /* 切的是第一屏的主角，回顶部比保持滚动位置更合理 —— 否则卡片高度一变，
       用户视线会落在 K 线中间，完全看不到刚切过去的那张图 */
    render();
    return;
  }
  if (t.dataset.review) {
    state.reviewPeriod = t.dataset.review;
    render(true);
    return;
  }
  if (t.dataset.cat) {
    state.category = t.dataset.cat;
    render(true);
    return;
  }
  if (t.dataset.eat) {
    const shop = shops.find(s => String(s.id) === t.dataset.eat);
    if (!shop) return;
    const kcal = caloriesOf(shop);
    state.logs.push({
      id: Date.now(),
      type: 'food',
      name: `${shop.shop} · ${shop.dish} ${shop.grams}g`,
      kcal,
      price: Number(shop.price) || 0
    });
    state.view = 'market';
    saveLogs();
    render();
    toast(`已做空 ¥${shop.price} · 摄入 +${kcal} kcal`);
    return;
  }
  if (t.dataset.edit) {
    const shop = shops.find(s => String(s.id) === t.dataset.edit);
    if (shop) openSheet(shop);
    return;
  }
  if (t.dataset.add) {
    openSheet(null);
    return;
  }
  if (t.dataset.scan) {
    openSheet(null);
    $('btn-scan').click();
    return;
  }
  if (t.dataset.del) {
    state.logs = state.logs.filter(l => String(l.id) !== t.dataset.del);
    /* 正在编辑的刚好被删掉，就退出编辑态，否则表单会指向一条不存在的记录 */
    if (String(state.exEditId) === t.dataset.del) {
      state.exEditId = null;
      state.exDraft = { pick: -1, name: '', met: 5, mins: 30, kcal: null };
    }
    saveLogs();
    render();
  }
});

/* 运动表单的输入：只更新草稿和局部 DOM，不重绘整页 */

});

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function currentDraft() {

    shop: $('f-shop').value.trim(),

  };
}

function updatePreview() {
  const d = currentDraft();
  const kcal = caloriesOf({ per100: d.per100, grams: d.grams });
  $('p-kcal').textContent = kcal.toLocaleString('zh-CN');
  const base = CAT_BASE[d.cat] || 800;
  if (d.price > 0 && kcal > 0) {
    const eff = Math.round(((base - kcal) / d.price) * 10) / 10;
    $('p-eff').textContent = `做空效率 ${eff > 0 ? '+' : ''}${eff} kcal/元`;
    $('p-eff').style.color = eff >= 0 ? 'var(--down)' : 'var(--up)';
  } else {
    $('p-eff').textContent = '做空效率 —';
    $('p-eff').style.color = 'var(--muted)';
  }
}

function searchFood(q) {
  const pool = [];
  userFoods.forEach((f) => pool.push({ n: f.n, k: f.k, p: f.p, f: f.f, c: f.c, fb: f.fb, mine: true }));
  FOOD_DB.forEach((f) => pool.push(f));
  const seen = new Set();
  return pool
    .filter((f) => {
      if (seen.has(f.n)) return false;
      const hit = f.n.includes(q) || (f.alias || []).some((a) => a.includes(q));
      if (hit) seen.add(f.n);
      return hit;
    })
    .slice(0, 7);
}

function renderSug() {
  const q = $('f-food').value.trim();
  const box = $('sug');
  if (!q) {
    box.innerHTML = '';
    return;
  }
  const hits = searchFood(q);
  let html = hits
    .map(
      (f) =>
        `<button data-food="${esc(f.n)}" data-k="${f.k}">${f.mine ? '<span style="color:var(--gold)">我</span> ' : ''}${esc(f.n)} ${f.k}</button>`
    )
    .join('');
  html += `<button class="net" data-net="1">联网搜</button>`;
  box.innerHTML = html;
}

/**
 * 联网检索：Open Food Facts 开放接口，无需鉴权。
 * 局限要说清楚——它主要覆盖带条码的预包装食品，中式家常菜命中率低，
 * 所以只作为"本地库没有时的补充"，失败一律降级到手动填写。
 */
async function searchOnline(q) {
  $('sug').innerHTML = '<button disabled>联网检索中…</button>';
  const sources = [
    (kw) =>
      'https://cn.openfoodfacts.org/api/v2/search?search_terms=' +
      encodeURIComponent(kw) +
      '&page_size=8&fields=product_name,nutriments,brands',
    (kw) =>
      'https://world.openfoodfacts.org/cgi/search.pl?search_terms=' +
      encodeURIComponent(kw) +
      '&search_simple=1&action=process&json=1&page_size=8&fields=product_name,nutriments,brands'
  ];

  for (const build of sources) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      const res = await fetch(build(q), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) continue;
      const data = await res.json();
      const list = (data.products || [])
        .map((p) => {
          const nm = (p.product_name || '').trim();
          const n = p.nutriments || {};
          let k = n['energy-kcal_100g'];
          if (!k && n.energy_100g) k = n.energy_100g / 4.184;
          return { name: nm, kcal: Math.round(k) };
        })
        .filter((x) => x.name && x.kcal > 0)
        .slice(0, 6);
      if (!list.length) continue;
      $('sug').innerHTML = list
        .map(
          (p) =>
            `<button data-online="${p.kcal}" data-oname="${esc(p.name)}">${esc(p.name.slice(0, 16))} ${p.kcal}</button>`
        )
        .join('');
      toast(`找到 ${list.length} 条，点选填入每 100g 热量`);
      return;
    } catch (e) {
      /* 换下一个数据源 */
    }
  }
  toast('联网数据源暂时不可用，手动填一次就会记住');
  renderSug();
}

function saveSheet() {

  if (!d.grams || d.grams <= 0) return toast('请填写克重');
  if (!d.per100 || d.per100 <= 0) return toast('请填写每 100g 热量');

  if (editingId) {
    const idx = shops.findIndex((s) => String(s.id) === String(editingId));
    if (idx >= 0) shops[idx] = { ...shops[idx], ...d, dish: d.food || shops[idx].dish };
  } else {
    shops.push({ id: 'u' + Date.now(), ...d, dish: d.food || '未命名' });
  }
  learnFood(d.food, d.per100, { p: d.p, f: d.f, c: d.c, fb: d.fb });
  saveShops();
  const wasEdit = !!editingId;
  closeSheet();
  render();
  toast(wasEdit ? '标的已更新' : '已加入盘口，热量已记住');

  closeSheet();
  render();

/* ================= 拍照识别（OCR） ================= */

/**
 * 解析营养成分表文本。纯函数，可独立测试。
 * 输入是 OCR 原始文本（含换行与错位空格），输出只包含"确实识别到"的字段。
 *
 * 只面向包装背面的营养成分表，针对这种版式做了三件事：
 *   1. 剔除 NRV% —— 那一列是百分比，混进来会把"脂肪 10g"读成 20
 *   2. 识别「每 100g」还是「每份」，按份换算回每 100g
 *   3. 修正常见错字（蛋自质、脂防、碳水…）
 */
function parseNutritionText(raw) {
  const flat = String(raw || '').replace(/\s+/g, '').replace(/[，,、]/g, '');
  if (!flat) return {};

  const fixed = flat
    .replace(/蛋自质|蛋日质|蛋向质|蛋自|蛋白贡/g, '蛋白质')
    .replace(/脂防|脂肮|脂肋/g, '脂肪')
    .replace(/碳水化合物|碳化合物|炭水化合物/g, '碳水化合物')
    .replace(/膳食纡维|膳食纤维|膳食维/g, '膳食纤维')
    .replace(/能置|能童/g, '能量');

  /* NRV% 整列剔除，避免百分比被当成含量 */
  const clean = fixed.replace(/\d+(?:\.\d+)?%/g, '');
  const noTrans = clean.replace(/反式脂肪(?:酸)?|饱和脂肪(?:酸)?/g, '');

  /* 判断表格是按每 100g 还是按份标注 */
  let scale = 1;
  let basis = '每100g';
  let servingG = 0;
  if (!/每100(?:克|g|毫升|ml)/i.test(clean)) {
    const m =
      clean.match(/每份[（(]?(\d+(?:\.\d+)?)(?:克|g|毫升|ml)/) ||
      clean.match(/每(?:份|包|袋|支|瓶|x)[^0-9]{0,4}(\d+(?:\.\d+)?)(?:克|g)/i);
    if (m && +m[1] > 0 && Math.abs(+m[1] - 100) > 0.5) {
      servingG = +m[1];
      scale = 100 / servingG;
      basis = `每份${servingG}g`;
    }
  }

  const out = {};
  const grab = (text, re) => {
    const m = text.match(re);
    return m ? parseFloat(m[1]) : null;
  };
  const put = (key, v, dp) => {
    if (v === null) return;
    const scaled = v * scale;
    out[key] = dp === 0 ? Math.round(scaled) : Math.round(scaled * 10) / 10;
  };

  const e =
    clean.match(/能量[^0-9]{0,6}(\d+(?:\.\d+)?)(千焦|kj|kcal|千卡|大卡)?/i) ||
    clean.match(/热量[^0-9]{0,6}(\d+(?:\.\d+)?)(千焦|kj|kcal|千卡|大卡)?/i);
  if (e) {
    let v = parseFloat(e[1]);
    const unit = (e[2] || '').toLowerCase();
    if (unit === '千焦' || unit === 'kj') v = v / 4.184;
    put('k', v, 0);
  }

  put('p', grab(clean, /蛋白质[^0-9]{0,6}(\d+(?:\.\d+)?)/), 1);
  put('f', grab(noTrans, /脂肪[^0-9]{0,6}(\d+(?:\.\d+)?)/), 1);
  put('c', grab(clean, /碳水化合物[^0-9]{0,6}(\d+(?:\.\d+)?)/) ?? grab(clean, /碳水[^0-9]{0,6}(\d+(?:\.\d+)?)/), 1);
  put('fb', grab(clean, /膳食纤维[^0-9]{0,6}(\d+(?:\.\d+)?)/), 1);

  if (out.k || out.p != null) {
    out.basis = basis;
    if (scale !== 1) out.scale = Math.round(scale * 100) / 100;
    if (servingG) out.servingG = servingG;
  }
  return out;
}

let scanBusy = false;

function setScanStatus(msg) {
  const el = $('scan-status');
  if (el) el.textContent = msg;
}

function loadTesseract() {
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.async = true;
    s.onload = () => (window.Tesseract ? resolve(window.Tesseract) : reject(new Error('引擎未就绪')));
    s.onerror = () => reject(new Error('引擎加载失败'));
    document.head.appendChild(s);
  });
}

/* 成分表的字号很小，全局阈值会把灰底上的浅字整片吃掉，
   所以用局部均值（积分图加速）做自适应二值化，并把小图放大到 1400px 再识别。 */
function enhanceImage(file, targetW = 1400) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(2.2, Math.max(0.4, targetW / img.width));
      const w = Math.max(2, Math.round(img.width * scale));
      const h = Math.max(2, Math.round(img.height * scale));
      const cv = document.createElement('canvas');
      cv.width = w;
      cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);

      const data = ctx.getImageData(0, 0, w, h);
      const px = data.data;
      const gray = new Uint8ClampedArray(w * h);
      for (let i = 0, p = 0; i < px.length; i += 4, p++) {
        gray[p] = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
      }

      /* 积分图：O(1) 求任意矩形内的灰度均值 */
      const iw = w + 1;
      const integral = new Float32Array(iw * (h + 1));
      for (let y = 0; y < h; y++) {
        let rowSum = 0;
        for (let x = 0; x < w; x++) {
          rowSum += gray[y * w + x];
          integral[(y + 1) * iw + (x + 1)] = integral[y * iw + (x + 1)] + rowSum;
        }
      }

      const r = Math.max(6, Math.round(w / 32));
      for (let y = 0; y < h; y++) {
        const y0 = Math.max(0, y - r);
        const y1 = Math.min(h - 1, y + r);
        for (let x = 0; x < w; x++) {
          const x0 = Math.max(0, x - r);
          const x1 = Math.min(w - 1, x + r);
          const sum =
            integral[(y1 + 1) * iw + (x1 + 1)] -
            integral[y0 * iw + (x1 + 1)] -
            integral[(y1 + 1) * iw + x0] +
            integral[y0 * iw + x0];
          const cnt = (y1 - y0 + 1) * (x1 - x0 + 1);
          const mean = sum / cnt;
          /* 低于局部均值一档即判为墨迹；230 以上一律视作纸面，避免大片反光被拉黑 */
          const v = gray[y * w + x] < mean * 0.9 && mean < 232 ? 0 : 255;
          const pi = (y * w + x) * 4;
          px[pi] = px[pi + 1] = px[pi + 2] = v;
          px[pi + 3] = 255;
        }
      }
      ctx.putImageData(data, 0, 0);
      cv.toBlob((b) => {
        URL.revokeObjectURL(url);
        b ? resolve(b) : reject(new Error('图片处理失败'));
      }, 'image/png');
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('图片读取失败'));
    };
    img.src = url;
  });
}

async function handleScan(file) {
  if (scanBusy) return;
  scanBusy = true;
  const thumb = $('scan-thumb');
  thumb.src = URL.createObjectURL(file);
  thumb.style.display = 'block';

  try {
    setScanStatus('加载识别引擎…');
    const T = await loadTesseract();
    setScanStatus('加载中文模型（首次约 25 秒）…');
    const worker = await T.createWorker('chi_sim', 1, {
      logger: (m) => {
        if (m.status === 'recognizing text') setScanStatus('识别成分表 ' + Math.round((m.progress || 0) * 100) + '%');
      }
    });
    setScanStatus('增强对比度…');
    let target = file;
    try {
      target = await enhanceImage(file);
    } catch (e) {
      target = file;
    }
    const { data } = await worker.recognize(target);
    await worker.terminate();
    applyScan(parseNutritionText(data.text));
  } catch (e) {
    setScanStatus('识别不可用，请手动填写每 100g 热量');
    toast('识别失败：' + (e.message || '未知错误'));
  } finally {
    scanBusy = false;
  }
}

function applyScan(parsed) {
  const hit = [];
  if (parsed.k) {
    $('f-per100').value = parsed.k;
    hit.push('能量');
  }
  if (parsed.p != null) {
    $('f-p').value = parsed.p;
    hit.push('蛋白质');
  }
  if (parsed.f != null) {
    $('f-f').value = parsed.f;
    hit.push('脂肪');
  }
  if (parsed.c != null) {
    $('f-c').value = parsed.c;
    hit.push('碳水');
  }
  if (parsed.fb != null) {
    $('f-fb').value = parsed.fb;
    hit.push('纤维');
  }

  if (!hit.length) {
    setScanStatus('这张图没读出营养数据。确认拍的是背面那张表格，光线均匀、别反光，或直接手动填写。');
    toast('没识别到成分表，可重拍或手填');
    return;
  }

  /* 按份标注的表已经换算成每 100g，克重默认填份量更贴近一包的实际摄入 */
  if (!$('f-grams').value) $('f-grams').value = parsed.servingG || 100;
  $('nutri-box').open = true;
  updatePreview();

  const basisTxt = parsed.scale ? `已从${parsed.basis}换算为每 100g` : '按每 100g';
  setScanStatus(`识别到 ${hit.join(' / ')}，${basisTxt}。数值请核对后再保存。`);
  toast(`识别到 ${hit.length} 项，务必核对`);
}

$('file-cam').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) handleScan(f);
  e.target.value = '';
});

$('mask').addEventListener('click', closeSheet);
$('btn-save').addEventListener('click', saveSheet);

/* ---------- 设置页输入：只刷新结果区，不重绘整页 ----------
   如果每次按键都 render()，输入框会被替换掉、焦点丢失，打"175"只能打进一个"1"。 */
const PF_FIELD = { age: 'age', height: 'height', deficit: 'deficit', manual: 'manualKcal' };

function applyProfileInput(el) {
  const v = Number(el.value);
  if (!isFinite(v) || el.value === '') return;
  const key = el.dataset.pf;

  if (key === 'weight') {
    const w = Math.min(250, Math.max(30, v));
    if (Math.abs(w - state.weight) < 0.001) return;
    state.weight = w;
    rebuildHistory();            // 体重变了，整条历史曲线要跟着重算
  } else if (PF_FIELD[key]) {
    profile[PF_FIELD[key]] = v;
  }
  saveProfile();

  const box = document.getElementById('p-result');
  if (box) box.innerHTML = profileResultHTML();
}

document.body.addEventListener('input', (e) => {
  if (e.target && e.target.dataset && e.target.dataset.pf) applyProfileInput(e.target);
});

/* 失焦时归一化（越界值夹回合法区间），整页重绘一次，保持滚动位置不跳 */
document.body.addEventListener('change', (e) => {
  const el = e.target;
  if (!el || !el.dataset || !el.dataset.pf) return;
  const key = el.dataset.pf;
  const lim = { age: [12, 99], height: [120, 230], weight: [30, 250], deficit: [0, 1200], manual: [800, 5000] }[key];
  if (lim) {
    const v = Math.min(lim[1], Math.max(lim[0], Number(el.value) || lim[0]));
    if (key === 'weight') { state.weight = v; rebuildHistory(); }
    else if (PF_FIELD[key]) profile[PF_FIELD[key]] = v;
    el.value = key === 'weight' ? v.toFixed(1) : String(v);
  }
  saveProfile();
  if (state.view === 'profile') render(true);
});

/* 交易日切换：原生日期控件，改完立刻生效 */
document.body.addEventListener('change', (e) => {
  if (e.target && e.target.id === 'datePick') switchDate(e.target.value);
});

/* 支持 #market / #review 这类深链，方便直接分享到某个页签。
   #nutri 保留兼容：营养已并入「我的」，落到该页的营养分段。 */
if (typeof location !== 'undefined' && location.hash) {
  let h = location.hash.replace('#', '');
  if (h === 'nutri') {
    state.view = 'profile';
    state.pfTab = 'nutri';
  } else if (h === 'set') {
    state.view = 'profile';
    state.pfTab = 'set';
  } else if (h === 'data') {
    state.view = 'profile';
    state.pfTab = 'data';
  } else if (['market', 'nearby', 'log', 'review', 'profile'].includes(h)) {
    state.view = h;
  }
}

/* 启动落在"今天"；这一天存过流水就用存过的，没有则用内置演示数据 */
state.selDate = todayStr();
DAY_STORE = loadDayStore();
if (DAY_STORE[state.selDate] && DAY_STORE[state.selDate].length) {
  state.logs = DAY_STORE[state.selDate].slice();
}

render();

/* 注册 Service Worker：只在 http(s) 下有效（file:// 打开时静默跳过，不影响使用）。
   HTML 走网络优先，所以更新页面后刷一下就是新的，不会被旧缓存锁死。 */
if (typeof navigator !== 'undefined' && navigator.serviceWorker && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* 没有 sw.js 就当没有 */ });
  });
}
